<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المشترك - مكتب مهندس علي لخدمات الإنترنت</title>
    <meta name="theme-color" content="#0d1526">
    <!-- إلغاء أي خدمة تخزين مؤقت قديمة لمنع تعليق التحديثات -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) { registration.unregister(); }
        });
      }
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 15px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        .top-nav { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .notif-bell-btn { background: #131d31; color: #f59e0b; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; position: relative; }
        .portal-container { background: #131d31; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); box-sizing: border-box; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 17px; }
        p { color: #94a3b8; font-size: 11px; text-align: center; margin-bottom: 15px; }
        input { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0d1526; border: 1px solid #1e293b; color: white; border-radius: 8px; box-sizing: border-box; font-size: 13px; text-align: center; }
        .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 6px; text-align: center; display: block; box-sizing: border-box; }
        .btn-search { background: #38bdf8; color: #090d16; }
        .btn-pay { background: #6366f1; color: #fff; }
        .btn-wa { background: #25d366; color: #fff; }
        .btn-logout { background: #ef4444; color: #fff; }
        .info-box { background: #0d1526; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; margin-top: 12px; display: none; }
        .info-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
        .info-label { color: #94a3b8; }
        .info-val { font-weight: bold; }
        .support-phones { background: #0d1526; border: 1px solid #1e293b; padding: 8px; border-radius: 8px; text-align: center; font-size: 11px; margin-top: 15px; color: #38bdf8; }
        
        /* شاشة التحميل والتحديث */
        #updateOverlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(13,21,38,0.95); z-index:99999; justify-content:center; align-items:center; flex-direction:column; color:#38bdf8; font-weight:bold; text-align:center; padding:20px; }
    </style>
</head>
<body>

<div id="updateOverlay">
    <div style="font-size:24px; margin-bottom:10px;">🔄</div>
    <div>جاري تحديث التطبيق إلى أحدث نسخة...</div>
    <div style="font-size:11px; color:#94a3b8; margin-top:5px;">يرجى الانتظار ثوانٍ معدودة</div>
</div>

<div class="top-nav">
    <div style="font-size:12px; color:#38bdf8; font-weight:bold;">مكتب مهندس علي</div>
</div>

<div class="portal-container">
    <h2>بوابة زبائن مهندس علي</h2>

    <div id="loginFormArea">
        <p>سجل الدخول باستخدام اليوزر ورقم الهاتف</p>
        <input type="text" id="clientUsernameInput" placeholder="اسم المستخدم (اليوزر)">
        <input type="password" id="clientPasswordInput" placeholder="كلمة المرور (رقم الهاتف)">
        <button class="btn btn-search" onclick="loginClient()">تسجيل الدخول</button>
    </div>

    <div id="clientInfoBox" class="info-box">
        <div class="info-row"><span class="info-label">اسم المشترك:</span><span class="info-val" id="cName" style="color:#38bdf8"></span></div>
        <div class="info-row"><span class="info-label">حالة الاشتراك:</span><span class="info-val" id="cStatus"></span></div>
        <div class="info-row"><span class="info-label">تاريخ الانتهاء:</span><span class="info-val" id="cEnd"></span></div>
        <div class="info-row"><span class="info-label">مبلغ الاشتراك:</span><span class="info-val" id="cPrice"></span></div>

        <button class="btn btn-pay" onclick="copyMasterNumber()">💳 نسخ رقم التحويل (07724850876)</button>
        <button class="btn btn-wa" onclick="sendWhatsAppReceipt()">💬 إرسال إشعار التحويل واتساب</button>
        <button class="btn btn-logout" onclick="logoutClient()">🚪 تسجيل الخروج</button>
    </div>

    <div class="support-phones">
        📞 هواتف المكتب:<br>
        <b>07818627764 - 07724850876</b>
    </div>
</div>

<script>
// رقم الإصدار الحالي لتطبيق المشترك
const CURRENT_APP_VERSION = "v1.0.5";

const firebaseConfig = {
    apiKey: "AIzaSyA2FMY9ZsJHO-9eCJzWPyT5NVJ7C36k94Y",
    authDomain: "ali-isp-system.firebaseapp.com",
    databaseURL: "https://ali-isp-system-default-rtdb.firebaseio.com",
    projectId: "ali-isp-system",
    storageBucket: "ali-isp-system.firebasestorage.app",
    messagingSenderId: "765763121547",
    appId: "1:765763121547:web:fd66cee15a8e412c357f8e",
    measurementId: "G-DQPH354WEF"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// فحص التحديث الذاتي من السحابة فوراً عند فتح التطبيق
db.ref('ali_app_version').on('value', (snapshot) => {
    let cloudVersion = snapshot.val();
    if (cloudVersion && cloudVersion !== CURRENT_APP_VERSION) {
        document.getElementById('updateOverlay').style.display = 'flex';
        setTimeout(() => {
            localStorage.clear();
            location.reload(true);
        }, 1500);
    }
});

let subs = [];
let foundSubscriber = null;
const adminPhone = "9647724850876";
const SESSION_KEY = "ali_portal_sync_session";

function cleanStr(str) {
    if (!str) return "";
    return String(str).replace(/\s+/g, '').toLowerCase().trim();
}

db.ref('ali_isp_subscribers').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        subs = Array.isArray(data) ? data.filter(item => item !== null) : Object.values(data);
    } else {
        subs = [];
    }

    let savedUser = localStorage.getItem(SESSION_KEY);
    if (savedUser) {
        let currentSub = subs.find(s => s && s.name && cleanStr(s.name) === cleanStr(savedUser));
        if (currentSub) {
            foundSubscriber = currentSub;
            showDashboard();
        } else {
            logoutClient(true);
        }
    } else {
        showLogin();
    }
});

function loginClient() {
    let inputUser = cleanStr(document.getElementById('clientUsernameInput').value);
    let inputPass = cleanStr(document.getElementById('clientPasswordInput').value);

    if(!inputUser || !inputPass) {
        alert("يرجى كتابة اسم المستخدم وكلمة المرور");
        return;
    }

    foundSubscriber = subs.find(s => {
        if (!s || !s.name) return false;
        let dbUser = cleanStr(s.name);
        let dbPass = cleanStr(s.phone);
        return (dbUser === inputUser) && (dbPass === inputPass);
    });

    if(foundSubscriber) {
        localStorage.setItem(SESSION_KEY, foundSubscriber.name);
        showDashboard();
    } else {
        alert("❌ تعذر تسجيل الدخول! التأكد من تطابق اليوزر ورقم الهاتف.");
    }
}

function showDashboard() {
    document.getElementById('cName').innerText = foundSubscriber.name;
    document.getElementById('cStatus').innerHTML = foundSubscriber.payStatus === 'واصل' ? '<span style="color:#10b981">واصل ✅</span>' : '<span style="color:#f59e0b">أجل ⏳</span>';
    document.getElementById('cEnd').innerText = foundSubscriber.endDate || "غير محدد";
    document.getElementById('cPrice').innerText = (foundSubscriber.price || 30000) + " د.ع";
    
    document.getElementById('loginFormArea').style.display = 'none';
    document.getElementById('clientInfoBox').style.display = 'block';
}

function showLogin() {
    document.getElementById('clientInfoBox').style.display = 'none';
    document.getElementById('loginFormArea').style.display = 'block';
}

function logoutClient(isAuto = false) {
    localStorage.removeItem(SESSION_KEY);
    foundSubscriber = null;
    showLogin();
    document.getElementById('clientUsernameInput').value = '';
    document.getElementById('clientPasswordInput').value = '';
    
    if(isAuto) {
        alert("⚠️ تم تسجيل الخروج تلقائياً لتحديث البيانات.");
    }
}

function copyMasterNumber() {
    navigator.clipboard.writeText("07724850876").then(() => alert("📋 تم نسخ رقم التحويل بنجاح"));
}

function sendWhatsAppReceipt() {
    if(!foundSubscriber) return;
    let msg = `مرحباً مهندس علي 📡\nتم تحويل مبلغ الاشتراك للمشترك: ${foundSubscriber.name}`;
    window.open(`https://api.whatsapp.com/send?phone=${adminPhone}&text=${encodeURIComponent(msg)}`, '_blank');
}
</script>
</body>
</html>
