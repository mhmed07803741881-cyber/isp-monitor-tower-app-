<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة المشترك - مكتب مهندس علي لخدمات الإنترنت</title>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 15px; box-sizing: border-box; display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; }
        .top-nav { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .notif-bell-btn { background: #131d31; color: #f59e0b; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .portal-container { background: #131d31; border: 1px solid #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); box-sizing: border-box; }
        h2 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 17px; }
        p { color: #94a3b8; font-size: 11px; text-align: center; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0d1526; border: 1px solid #1e293b; color: white; border-radius: 8px; box-sizing: border-box; font-size: 13px; text-align: center; }
        textarea { text-align: right; }
        .btn { width: 100%; padding: 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; margin-top: 6px; text-align: center; text-decoration: none; display: block; box-sizing: border-box; }
        .btn-search { background: #38bdf8; color: #090d16; }
        .btn-ticket { background: #ec4899; color: #fff; }
        .info-box { background: #0d1526; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; margin-top: 12px; display: none; }
        .info-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
        .info-label { color: #94a3b8; }
        .info-val { font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 99999; }
        .modal-content { background: #131d31; padding: 20px; border-radius: 12px; width: 90%; max-width: 320px; border: 1px solid #ec4899; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="portal-container">
    <h2>بوابة زبائن مهندس علي</h2>
    <p>أدخل اسم المستخدم (اليوزر) أو رقم الهاتف للتحقق من حسابك</p>

    <input type="text" id="clientQuery" placeholder="أدخل اليوزر أو رقم الهاتف">
    <button class="btn btn-search" onclick="searchClient()">بحث عن الحساب</button>

    <div id="clientInfoBox" class="info-box">
        <div class="info-row"><span class="info-label">اسم المشترك:</span><span class="info-val" id="cName" style="color:#38bdf8"></span></div>
        <div class="info-row"><span class="info-label">حالة الاشتراك:</span><span class="info-val" id="cStatus"></span></div>
        <div class="info-row"><span class="info-label">تاريخ الانتهاء:</span><span class="info-val" id="cEnd"></span></div>
        
        <button class="btn btn-ticket" onclick="openTicketModal()">🎫 إرسال تكت ومتابعة الردود</button>
    </div>
</div>

<!-- نافذة المحادثة والتكتات للمشترك -->
<div id="ticketModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#ec4899; text-align:center; font-size:15px;">🎫 تكتات الدعم الفني</h3>
        
        <textarea id="ticketMessageText" rows="3" placeholder="اكتب مشكلتك أو استفسارك هنا..."></textarea>
        <button class="btn btn-ticket" onclick="submitTicket()" style="margin-bottom:10px;">إرسال التكت للإدارة</button>

        <div style="font-size:11px; color:#94a3b8; margin-bottom:4px;">سجل المحادثة وتحديثات الأقسام:</div>
        <div id="ticketChatHistory" style="max-height: 140px; overflow-y: auto; background:#0d1526; padding:8px; border-radius:6px; font-size:11px; color:#cbd5e1; text-align:right; margin-bottom:10px;">
            لا توجد رسائل.
        </div>

        <button class="btn" onclick="closeTicketModal()" style="background:#1e293b; color:#38bdf8;">إغلاق</button>
    </div>
</div>

<script>
let foundSubscriber = null;

function searchClient() {
    let query = document.getElementById('clientQuery').value.trim().toLowerCase();
    if(!query) { alert("يرجى إدخال اليوزر أو رقم الهاتف"); return; }

    let subs = JSON.parse(localStorage.getItem('ali_isp_final_v23')) || [];
    foundSubscriber = subs.find(s => s.name.toLowerCase().includes(query) || s.phone.includes(query));

    if(foundSubscriber) {
        document.getElementById('cName').innerText = foundSubscriber.name;
        document.getElementById('cStatus').innerHTML = foundSubscriber.payStatus === 'واصل' ? '<span style="color:#10b981">واصل ✅</span>' : '<span style="color:#f59e0b">أجل ⏳</span>';
        document.getElementById('cEnd').innerText = foundSubscriber.endDate;
        document.getElementById('clientInfoBox').style.display = 'block';
    } else {
        alert("عذراً، لم يتم العثور على حساب.");
        document.getElementById('clientInfoBox').style.display = 'none';
    }
}

function openTicketModal() {
    if(!foundSubscriber) return;
    refreshChatHistory();
    document.getElementById('ticketModal').style.display = 'flex';
}
function closeTicketModal() { document.getElementById('ticketModal').style.display = 'none'; }

function refreshChatHistory() {
    let chats = JSON.parse(localStorage.getItem(`ticket_chat_${foundSubscriber.name}`)) || [];
    let chatHtml = chats.length === 0 ? "لا توجد ردود سابقة." : chats.map(c => `<div style="margin-bottom:6px; border-bottom:1px solid #1e293b; padding-bottom:4px;"><b>${c.sender}:</b> ${c.text}</div>`).join('');
    document.getElementById('ticketChatHistory').innerHTML = chatHtml;
}

function submitTicket() {
    let msg = document.getElementById('ticketMessageText').value.trim();
    if(!msg) { alert("يرجى كتابة رسالة التكت"); return; }

    let ticketNum = `#${Math.floor(1000 + Math.random() * 9000)}`;
    
    // حفظ التكت في قائمة التكتات العامة للإدارة
    let allTickets = JSON.parse(localStorage.getItem('all_client_tickets')) || [];
    allTickets.push({ subName: foundSubscriber.name, ticketNum: ticketNum, message: msg, status: 'جديد (بانتظار المراجعة)' });
    localStorage.setItem('all_client_tickets', JSON.stringify(allTickets));

    // إضافة الرسالة لسجل محادثة المشترك
    let chatItem = { sender: foundSubscriber.name, text: `[${ticketNum}] ${msg}` };
    let chats = JSON.parse(localStorage.getItem(`ticket_chat_${foundSubscriber.name}`)) || [];
    chats.push(chatItem);
    localStorage.setItem(`ticket_chat_${foundSubscriber.name}`, JSON.stringify(chats));

    // إرسال إشعار لصوت الجرس في لوحة الإدارة
    let notifs = JSON.parse(localStorage.getItem('ali_admin_notifications')) || [];
    notifs.push(`${new Date().toLocaleTimeString()} - 🎫 تكت جديد من المشترك: ${foundSubscriber.name}`);
    localStorage.setItem('ali_admin_notifications', JSON.stringify(notifs));

    alert("✅ تم إرسال التكت بنجاح! سيتم مراجعته وتحويله للأقسام المختصة قريباً.");
    document.getElementById('ticketMessageText').value = '';
    refreshChatHistory();
}
</script>
</body>
</html>
