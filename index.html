<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب الأبراج</title>
    <style>
        body { background-color: #0e1626; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; box-sizing: border-box; }
        
        /* الهيدر العلوي */
        .top-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .header-btns { display: flex; gap: 6px; }
        .icon-btn { background: #131d31; color: #94a3b8; border: 1px solid #1e293b; padding: 8px 12px; border-radius: 10px; font-size: 14px; cursor: pointer; }
        .title-area { text-align: left; }
        .title-area h1 { margin: 0; font-size: 18px; color: #fff; display: flex; align-items: center; gap: 5px; justify-content: flex-end; }
        .title-area p { margin: 3px 0 0 0; font-size: 11px; color: #64748b; }

        /* شريط الإحصائيات */
        .stats-bar { display: flex; gap: 15px; font-size: 13px; color: #94a3b8; margin-bottom: 12px; background: #131d31; padding: 10px 14px; border-radius: 10px; border: 1px solid #1e293b; align-items: center; }
        .stats-bar span { font-weight: bold; }

        /* صف الأزرار الأول */
        .toolbar-grid-1 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
        .action-btn { background: #131d31; color: #cbd5e1; border: 1px solid #1e293b; padding: 10px 5px; border-radius: 10px; font-size: 12px; cursor: pointer; text-align: center; white-space: nowrap; }
        .action-btn.active-blue { background: #38bdf8; color: #090d16; font-weight: bold; border-color: #38bdf8; }

        /* صف الأزرار الثاني */
        .toolbar-grid-2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
        .action-btn.active-green { background: #131d31; color: #10b981; border-color: #10b981; }

        /* مؤشرات الحالة الصغيرة */
        .indicators-row { display: flex; gap: 4px; justify-content: flex-end; margin-bottom: 12px; }
        .mini-box { width: 14px; height: 18px; background: #10b981; border-radius: 3px; }

        /* قسم الأبراج والتصنيفات */
        .towers-section { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 5px; }
        .tower-tab { background: #131d31; color: #cbd5e1; border: 1px solid #1e293b; padding: 8px 14px; border-radius: 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .tower-tab.active { background: #131d31; color: #38bdf8; border-color: #38bdf8; font-weight: bold; }

        /* صف أزرار التحكم بالأسفل */
        .bottom-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 15px; }

        /* حاوية الأجهزة */
        .devices-container { margin-top: 10px; }
        .empty-state { text-align: center; color: #64748b; padding: 40px 20px; background: #131d31; border-radius: 12px; border: 1px dashed #1e293b; font-size: 13px; }

        /* النوافذ المنبثقة (Modals) */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #131d31; padding: 20px; border-radius: 14px; width: 90%; max-width: 380px; border: 1px solid #1e293b; box-sizing: border-box; }
        .modal-content h3 { margin-top: 0; color: #fff; font-size: 15px; }
        input, select { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0e1626; border: 1px solid #1e293b; color: white; border-radius: 8px; box-sizing: border-box; font-size: 13px; }
        .submit-btn { width: 100%; padding: 11px; background: #38bdf8; color: #090d16; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .cancel-btn { width: 100%; padding: 10px; background: #1e293b; color: #94a3b8; border: none; border-radius: 8px; cursor: pointer; margin-top: 6px; font-size: 13px; }
    </style>
</head>
<body>

<!-- الهيدر العلوي -->
<div class="top-header">
    <div class="header-btns">
        <button class="icon-btn" onclick="alert('زر الطاقة / الخروج')">⏻</button>
        <button class="icon-btn" onclick="alert('الدعم الفني')">الدعم</button>
        <button class="icon-btn" onclick="alert('تغيير اللغة')">English</button>
        <button class="icon-btn" onclick="alert('الوضع الليلي/النهاري')">☀️</button>
    </div>
    <div class="title-area">
        <h1>مراقب الأبراج 📡</h1>
        <p id="headerSummary">0 جهاز على 0 برج</p>
    </div>
</div>

<!-- شريط الإحصائيات -->
<div class="stats-bar">
    <div><span id="statOnline" style="color:#10b981">0</span> يعمل</div>
    <div><span id="statSlow" style="color:#f59e0b">0</span> بطيء</div>
    <div><span id="statOffline" style="color:#ef4444">0</span> لا يعمل</div>
    <div style="margin-right:auto;"><span id="statAvgPing" style="color:#38bdf8">0.0</span> متوسط ms</div>
</div>

<!-- صف الأزرار الأول -->
<div class="toolbar-grid-1">
    <button class="action-btn" onclick="alert('تحديث الكل')">تحديث الكل</button>
    <button class="action-btn" onclick="alert('بحث عن أجهزة')">ابحث عن أجهزة</button>
    <button class="action-btn active-blue" onclick="openModal('addDeviceModal')">أضف أجهزة</button>
    <button class="action-btn" onclick="alert('بيانات الدخول')">بيانات الدخول</button>
</div>

<!-- صف الأزرار الثاني -->
<div class="toolbar-grid-2">
    <button class="action-btn active-green" onclick="alert('Ping لحظي مفعل')">🟢 Ping لحظي</button>
    <button class="action-btn" onclick="alert('فحص الآن')">فحص الآن</button>
    <button class="action-btn" onclick="openModal('vpnModal')">🔌 VPN</button>
    <button class="action-btn" onclick="alert('التنبيهات')">🔔 التنبيهات</button>
</div>

<!-- مؤشرات الحالة الصغيرة -->
<div class="indicators-row" id="indicatorsBar">
    <!-- ستتعبى تلقائياً عند إضافة أجهزة -->
</div>

<!-- شريط الأبراج (Tabs) -->
<div class="towers-section" id="towersTabs">
    <div class="tower-tab active" onclick="selectTower('all')">كل الأبراج</div>
</div>

<!-- صف أزرار التحكم بالأسفل -->
<div class="bottom-actions">
    <button class="action-btn active-blue" onclick="openModal('addTowerModal')">+ برج جديد</button>
    <button class="action-btn" onclick="alert('تصدير البيانات')">تصدير</button>
    <button class="action-btn" onclick="alert('استيراد البيانات')">استيراد</button>
</div>

<!-- قائمة الأجهزة والأبراج -->
<div class="devices-container" id="devicesList">
    <div class="empty-state">لا توجد أجهزة مضافة حالياً.<br>اضغط على <b>"+ برج جديد"</b> ثم <b>"أضف أجهزة"</b> للبدء.</div>
</div>

<!-- نافذة إضافة برج -->
<div id="addTowerModal" class="modal">
    <div class="modal-content">
        <h3>إضافة برج جديد</h3>
        <input type="text" id="newTowerName" placeholder="اسم البرج (مثال: Hilla)">
        <button class="submit-btn" onclick="saveTower()">حفظ البرج</button>
        <button class="cancel-btn" onclick="closeModal('addTowerModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة إضافة جهاز -->
<div id="addDeviceModal" class="modal">
    <div class="modal-content">
        <h3>إضافة جهاز جديد</h3>
        <select id="targetTowerSelect"></select>
        <input type="text" id="devNameInput" placeholder="اسم الجهاز أو نقطة البث">
        <input type="text" id="devIpInput" placeholder="عنوان الـ IP (مثال: 10.0.0.1)">
        <button class="submit-btn" onclick="saveDevice()">حفظ الجهاز</button>
        <button class="cancel-btn" onclick="closeModal('addDeviceModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة إعداد الـ VPN -->
<div id="vpnModal" class="modal">
    <div class="modal-content">
        <h3>🔌 إعدادات الـ VPN</h3>
        <input type="text" id="vpnHost" placeholder="Server Hostname / IP">
        <input type="text" id="vpnUser" placeholder="Username">
        <input type="password" id="vpnPass" placeholder="Password">
        <button class="submit-btn" onclick="saveVpn()">حفظ واعتماد</button>
        <button class="cancel-btn" onclick="closeModal('vpnModal')">إغلاق</button>
    </div>
</div>

<script>
// قاعدة بيانات محلية فارغة تماماً
let db = JSON.parse(localStorage.getItem('isp_pro_db')) || {};
let currentTower = 'all';

function render() {
    let towers = Object.keys(db);
    let totalDevs = 0;
    let onlineDevs = 0;
    let html = '';
    let tabsHtml = `<div class="tower-tab ${currentTower === 'all' ? 'active' : ''}" onclick="selectTower('all')">كل الأبراج (${Object.values(db).reduce((a,b)=>a+b.length,0)})</div>`;
    let selectHtml = '';
    let indicatorsHtml = '';

    towers.forEach(t => {
        let count = db[t].length;
        tabsHtml += `<div class="tower-tab ${currentTower === t ? 'active' : ''}" onclick="selectTower('${t}')">${count}/${count} ${t}</div>`;
        selectHtml += `<option value="${t}">${t}</option>`;
    });

    document.getElementById('towersTabs').innerHTML = tabsHtml;
    document.getElementById('targetTowerSelect').innerHTML = selectHtml || "<option value=''>أضف برجاً أولاً</option>";

    towers.forEach(tower => {
        if(currentTower !== 'all' && currentTower !== tower) return;
        db[tower].forEach(d => {
            totalDevs++;
            onlineDevs++;
            indicatorsHtml += `<div class="mini-box" title="${d.name}"></div>`;
            html += `
                <div style="background:#131d31; border:1px solid #1e293b; padding:12px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-right:4px solid #10b981;">
                    <div>
                        <div style="font-size:14px; font-weight:bold; color:#38bdf8;">${d.ip}</div>
                        <div style="font-size:11px; color:#94a3b8;">${d.name} [${tower}]</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <span style="font-size:12px; color:#10b981; font-weight:bold;">1.8ms</span>
                        <button onclick="deleteDev('${tower}', ${d.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:14px;">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    document.getElementById('devicesList').innerHTML = html || `<div class="empty-state">لا توجد أجهزة في هذا القسم حالياً.<br>اضغط على <b>"+ برج جديد"</b> ثم <b>"أضف أجهزة"</b>.</div>`;
    document.getElementById('statOnline').innerText = onlineDevs;
    document.getElementById('statAvgPing5' || 'statAvgPing').innerText = totalDevs > 0 ? "18.5" : "0.0";
    document.getElementById('headerSummary').innerText = `${totalDevs} جهاز على ${towers.length} برج`;
    document.getElementById('indicatorsBar').innerHTML = indicatorsHtml;
}

function selectTower(t) { currentTower = t; render(); }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function saveTower() {
    let name = document.getElementById('newTowerName').value.trim();
    if(!name) { alert("أدخل اسم البرج"); return; }
    if(!db[name]) db[name] = [];
    localStorage.setItem('isp_pro_db', JSON.stringify(db));
    document.getElementById('newTowerName').value = '';
    closeModal('addTowerModal');
    render();
}

function saveDevice() {
    let tower = document.getElementById('targetTowerSelect').value;
    let name = document.getElementById('devNameInput').value.trim() || "AP";
    let ip = document.getElementById('devIpInput').value.trim();
    if(!tower) { alert("اختر برجاً أولاً"); return; }
    if(!ip) { alert("أدخل عنوان الـ IP"); return; }

    db[tower].push({ id: Date.now(), name, ip });
    localStorage.setItem('isp_pro_db', JSON.stringify(db));
    document.getElementById('devNameInput').value = '';
    document.getElementById('devIpInput').value = '';
    closeModal('addDeviceModal');
    render();
}

function deleteDev(tower, id) {
    if(confirm("هل تريد حذف هذا الجهاز؟")) {
        db[tower] = db[tower].filter(d => d.id !== id);
        localStorage.setItem('isp_pro_db', JSON.stringify(db));
        render();
    }
}

function saveVpn() {
    let host = document.getElementById('vpnHost').value.trim();
    if(!host) { alert("أدخل معلومات الـ VPN"); return; }
    alert("تم حفظ إعدادات الـ VPN بنجاح!");
    closeModal('vpnModal');
}

render();
</script>
</body>
</html>
