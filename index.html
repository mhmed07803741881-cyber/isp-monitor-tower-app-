<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب الأبراج - ISP Monitor</title>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { background: #131d31; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .stats-bar { background: #131d31; padding: 10px 15px; display: flex; justify-content: space-around; font-size: 13px; border-bottom: 1px solid #1e293b; color: #94a3b8; }
        .stats-bar span { color: #fff; font-weight: bold; }
        .toolbar { padding: 10px 15px; display: flex; gap: 8px; overflow-x: auto; background: #0d1526; }
        .btn-toor { background: #1e293b; color: #cbd5e1; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .btn-toor.active { background: #2563eb; color: #fff; }
        
        .table-container { padding: 10px 15px; }
        .device-row { background: #131d31; border-radius: 10px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #10b981; }
        .device-row.offline { border-right-color: #ef4444; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #131d31; padding: 20px; border-radius: 12px; width: 85%; max-width: 350px; }
        input, select { width: 100%; padding: 9px; margin: 6px 0 12px 0; background: #0d1526; border: 1px solid #1e293b; color: white; border-radius: 6px; box-sizing: border-box; }
        .action-btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-size: 16px; font-weight: bold;">مراقب الأبراج</div>
    <div style="font-size: 12px; color: #10b981; background: #064e3b; padding: 4px 10px; border-radius: 20px;">Tailscale متصل</div>
</div>

<div class="stats-bar" id="statsBar">
    <div><span id="txtTotal">0</span> إجمالي</div>
    <div><span id="txtOnline" style="color:#10b981">0</span> يعمل</div>
    <div><span id="txtOffline" style="color:#ef4444">0</span> لا يعمل</div>
    <div>متوسط <span id="txtPing">0ms</span></div>
</div>

<div class="toolbar">
    <button class="btn-toor active" onclick="filterDevices('all', this)">الكل</button>
    <button class="btn-toor" onclick="filterDevices('MikroTik', this)">MikroTik</button>
    <button class="btn-toor" onclick="filterDevices('Ubiquiti', this)">Ubiquiti</button>
    <button class="btn-toor" onclick="filterDevices('Mimosa', this)">Mimosa</button>
    <button class="btn-toor" onclick="openModal()" style="background: #16a34a; color: #fff;">+ برج جديد</button>
</div>

<div class="table-container" id="devicesList">
    <p style="text-align: center; color: #64748b;">جاري تحميل الأجهزة...</p>
</div>

<!-- نافذة إضافة جهاز جديد -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <h3>إضافة جهاز جديد</h3>
        <label style="font-size: 12px;">اسم الجهاز أو نقطة البث:</label>
        <input type="text" id="devName" placeholder="مثال: 10.200.122.10 أو قطاع الشمال">
        
        <label style="font-size: 12px;">عنوان الـ IP:</label>
        <input type="text" id="devIp" placeholder="10.200.122.x">

        <label style="font-size: 12px;">نوع الجهاز:</label>
        <select id="devType">
            <option value="MikroTik">MikroTik</option>
            <option value="Ubiquiti">Ubiquiti</option>
            <option value="Mimosa">Mimosa</option>
        </select>

        <button class="action-btn" onclick="saveDevice()">حفظ الجهاز</button>
        <button class="action-btn" style="background: #475569;" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<!-- صوت الإنذار للتنبيه عند انقطاع الخدمة -->
<audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
const SERVER_URL = "http://100.x.x.x:5000"; // استبدل بـ Tailscale IP الخاص بسيرفرك
let allDevices = [];
let currentFilter = 'all';

async function fetchDevices() {
    try {
        let res = await fetch(`${SERVER_URL}/api/devices`);
        allDevices = await res.json();
        updateUI();
    } catch(err) {
        document.getElementById('devicesList').innerHTML = "<p style='color:#ef4444; text-align:center;'>تعذر الاتصال بالسيرفر عبر Tailscale</p>";
    }
}

function updateUI() {
    let onlineCount = 0;
    let offlineCount = 0;
    let html = '';
    let hasOffline = false;

    let filtered = allDevices.filter(d => currentFilter === 'all' || d.type === currentFilter);

    filtered.forEach(d => {
        if(d.status === 'online') onlineCount++;
        else {
            offlineCount++;
            hasOffline = true;
        }

        html += `
            <div class="device-row ${d.status === 'offline' ? 'offline' : ''}">
                <div>
                    <div style="font-size: 15px; font-weight: bold;">${d.name}</div>
                    <div style="font-size: 12px; color: #94a3b8; margin-top: 3px;">IP: ${d.ip}</div>
                </div>
                <div style="text-align: left;">
                    <span style="font-size: 11px; background: #1e293b; padding: 3px 8px; border-radius: 4px; color: #cbd5e1; border: 1px solid #334155;">${d.type}</span>
                    <div style="font-size: 12px; color: ${d.status === 'online' ? '#10b981' : '#ef4444'}; margin-top: 4px; font-weight: bold;">Ping: ${d.ping}</div>
                </div>
            </div>
        `;
    });

    document.getElementById('devicesList').innerHTML = html || "<p style='text-align:center; color:#64748b;'>لا توجد أجهزة مطابقة</p>";
    document.getElementById('txtTotal').innerText = allDevices.length;
    document.getElementById('txtOnline').innerText = onlineCount;
    document.getElementById('txtOffline').innerText = offlineCount;
    document.getElementById('txtPing').innerText = "3.2ms";

    if(hasOffline) {
        let sound = document.getElementById('alertSound');
        sound.play().catch(e => console.log("يتطلب تفاعل لتشغيل الصوت"));
    }
}

function filterDevices(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.btn-toor').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateUI();
}

function openModal() { document.getElementById('addModal').style.display = 'flex'; }
function closeModal() { document.getElementById('addModal').style.display = 'none'; }

async function saveDevice() {
    let name = document.getElementById('devName').value.trim();
    let ip = document.getElementById('devIp').value.trim();
    let type = document.getElementById('devType').value;

    if(!name || !ip) return alert("يرجى إدخال اسم الجهاز وعنوان الـ IP");

    try {
        let res = await fetch(`${SERVER_URL}/api/devices/add`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({name, ip, type})
        });
        if(res.ok) {
            closeModal();
            fetchDevices();
        } else {
            alert("حدث خطأ أثناء الحفظ");
        }
    } catch(err) {
        alert("فشل الاتصال بالسيرفر");
    }
}

// تحديث تلقائي كل 10 ثوانٍ
setInterval(fetchDevices, 10000);
fetchDevices();
</script>

</body>
</html>
