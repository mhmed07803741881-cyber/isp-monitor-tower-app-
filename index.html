<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المشتركين - مهندس علي لخدمات الإنترنت</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; box-sizing: border-box; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .title-area h1 { margin: 0; font-size: 15px; color: #38bdf8; }
        .title-area p { margin: 2px 0 0 0; font-size: 10px; color: #94a3b8; }
        .header-btns { display: flex; gap: 5px; }

        .stats-bar { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 10px; background: #131d31; padding: 6px; border-radius: 8px; border: 1px solid #1e293b; align-items: center; gap: 4px; }
        .filter-tab { flex: 1; text-align: center; padding: 8px 4px; border-radius: 6px; cursor: pointer; background: #0d1526; border: 1px solid #1e293b; font-size: 10px; font-weight: bold; }
        .filter-tab.active { background: #38bdf8; color: #090d16; border-color: #38bdf8; }

        .toolbar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-bottom: 8px; }
        .action-btn { background: #131d31; color: #cbd5e1; border: 1px solid #1e293b; padding: 10px 4px; border-radius: 8px; font-size: 11px; cursor: pointer; text-align: center; }
        .action-btn.active-blue { background: #38bdf8; color: #090d16; font-weight: bold; }
        .action-btn.earthlink-btn { background: #e11d48; color: #fff; font-weight: bold; grid-column: span 2; }
        .action-btn.import-btn { background: #f59e0b; color: #000; font-weight: bold; }
        .action-btn.delete-btn { background: #ef4444; color: #fff; font-weight: bold; }
        .action-btn.notify-btn { background: #8b5cf6; color: #fff; font-weight: bold; }
        .action-btn.broadcast-btn { background: #06b6d4; color: #090d16; font-weight: bold; grid-column: span 2; }
        .action-btn.tickets-btn { background: #ec4899; color: #fff; font-weight: bold; grid-column: span 2; }

        .search-box { width: 100%; padding: 10px; margin-bottom: 8px; background: #131d31; border: 1px solid #1e293b; color: white; border-radius: 8px; box-sizing: border-box; font-size: 12px; }
        .sub-card { background:#131d31; border:1px solid #1e293b; padding:12px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-right:4px solid #10b981; cursor: pointer; }
        .sub-card.expired { border-right-color: #ef4444; }
        .sub-card.agel { border-right-color: #f59e0b; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 99999; }
        .modal-content { background: #131d31; padding: 20px; border-radius: 12px; width: 90%; max-width: 360px; border: 1px solid #38bdf8; box-sizing: border-box; }

        input, select, textarea { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0d1526; border: 1px solid #1e293b; color: white; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .submit-btn { width: 100%; padding: 11px; background: #38bdf8; color: #090d16; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .cancel-btn { width: 100%; padding: 10px; background: #1e293b; color: #94a3b8; border: none; border-radius: 6px; cursor: pointer; margin-top: 6px; font-size: 13px; }
        
        .ticket-item { background: #0d1526; border: 1px solid #1e293b; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 11px; }
    </style>
</head>
<body>

<audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<div class="top-header">
    <div class="title-area">
        <h1>مهندس علي لخدمات الإنترنت</h1>
        <p>هواتف المكتب: 07818627764 - 07724850876</p>
    </div>
    <div class="header-btns">
        <button class="action-btn" onclick="openNotificationsModal()" style="padding: 6px 10px; font-size:11px; background:#1e293b; color:#f59e0b;">🔔 الإشعارات</button>
        <button class="action-btn" onclick="openPinModal()" style="padding: 6px 10px; font-size:10px; background:#1e293b; color:#38bdf8;">⚙️ الرمز</button>
    </div>
</div>

<div class="stats-bar">
    <div class="filter-tab active" id="tab-all" onclick="setFilter('all')">الكل (<span id="totalSubs">0</span>)</div>
    <div class="filter-tab" id="tab-paid" onclick="setFilter('paid')" style="color:#10b981;">واصل (<span id="paidSubs">0</span>)</div>
    <div class="filter-tab" id="tab-agel" onclick="setFilter('agel')" style="color:#f59e0b;">غير واصل (<span id="agelSubs">0</span>)</div>
    <div class="filter-tab" id="tab-expired" onclick="setFilter('expired')" style="color:#ef4444;">منتهي (<span id="expiredSubs">0</span>)</div>
</div>

<input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن اسم المشترك أو رقم الهاتف..." oninput="renderSubs()">

<div class="toolbar-grid">
    <button class="action-btn active-blue" onclick="openModal()">+ إضافة مشترك</button>
    <button class="action-btn import-btn" onclick="importExcelOrJson()">📥 استيراد ملف أيرثلنك</button>
    <button class="action-btn notify-btn" onclick="sendGroupDebtReminder()">📢 تنبيه غير المسددين</button>
    <button class="action-btn broadcast-btn" onclick="openBroadcastModal()">📣 إرسال إشعار عام للكل</button>
    <button class="action-btn tickets-btn" onclick="openTicketsManagerModal()">🎫 إدارة والرد المباشر على التكتات</button>
    <button class="action-btn" onclick="exportData()" style="background:#10b981; color:#fff; grid-column: span 2;">💾 حفظ نسخة احتياطية</button>
    <button class="action-btn earthlink-btn" onclick="openEarthlinkDirect()">🌐 فتح لوحة ريسلر أيرثلنك</button>
</div>

<div id="subList">
    <div style="text-align: center; color: #64748b; padding: 30px;">لا توجد اشتراكات مسجلة.</div>
</div>

<!-- نافذة إدارة والرد المباشر على التكتات -->
<div id="ticketsManagerModal" class="modal">
    <div class="modal-content" style="border-color: #ec4899; max-width: 380px;">
        <h3 style="margin-top:0; color:#ec4899; text-align:center;">🎫 تكتات المشتركين الواردة</h3>
        <p style="font-size:10px; color:#94a3b8; text-align:center;">اضغط على (مشاهدة وتحويل) لتحديث الحالة، ثم (رد) لكتابة الرد للمشترك:</p>

        <div id="adminTicketsContainer" style="max-height: 250px; overflow-y: auto; margin-bottom: 10px;">
            <!-- يتم تعبئتها برمجياً -->
        </div>

        <button class="cancel-btn" onclick="closeTicketsManagerModal()">إغلاق</button>
    </div>
</div>

<!-- نافذة الرد الفردي على تكت -->
<div id="singleReplyModal" class="modal">
    <div class="modal-content" style="border-color: #38bdf8; max-width: 350px;">
        <h3 style="margin-top:0; color:#38bdf8; text-align:center;">💬 الرد على المشترك: <span id="replyTargetName"></span></h3>
        <textarea id="singleAdminReplyText" rows="3" placeholder="اكتب رد الأقسام المختصة هنا..."></textarea>
        <button class="submit-btn" onclick="submitSingleReply()" style="background:#10b981; color:#fff; margin-bottom:6px;">إرسال الرد</button>
        <button class="cancel-btn" onclick="closeSingleReplyModal()">إلغاء</button>
    </div>
</div>

<!-- نافذة الإشعارات -->
<div id="notificationsModal" class="modal">
    <div class="modal-content" style="border-color: #f59e0b;">
        <h3 style="margin-top:0; color:#f59e0b; text-align:center;">🔔 سجل إشعارات النظام</h3>
        <div id="notificationsList" style="max-height: 200px; overflow-y: auto; background:#0d1526; padding:8px; border-radius:6px; font-size:11px; margin-bottom:12px; color:#cbd5e1;">
            لا توجد إشعارات جديدة.
        </div>
        <button class="submit-btn" onclick="clearNotifications()" style="background:#ef4444; color:#fff; margin-bottom:6px;">مسح السجل</button>
        <button class="cancel-btn" onclick="closeNotificationsModal()">إغلاق</button>
    </div>
</div>

<script>
let subs = [];
try { subs = JSON.parse(localStorage.getItem('ali_isp_final_v23')) || []; } catch(e) { subs = []; }
let activeReplySubscriber = "";

function checkNewNotifications() {
    let notifs = JSON.parse(localStorage.getItem('ali_admin_notifications')) || [];
    let lastCount = parseInt(localStorage.getItem('ali_last_notif_count') || '0');
    if(notifs.length > lastCount) {
        let sound = document.getElementById('notifSound');
        if(sound) { sound.play().catch(e => console.log(e)); }
        localStorage.setItem('ali_last_notif_count', notifs.length);
    }
}
setInterval(checkNewNotifications, 3000);

function openEarthlinkDirect() { window.open("https://admin.earthlink.iq/Login.aspx?returnUrl=~/Home.aspx", "_blank"); }

function exportData() {
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(subs));
    let dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "ali_isp_backup.json");
    document.body.appendChild(dl);
    dl.click();
    dl.remove();
}

function openNotificationsModal() {
    let notifs = JSON.parse(localStorage.getItem('ali_admin_notifications')) || [];
    let listHTML = notifs.length === 0 ? '<div style="text-align:center; color:#64748b; padding:15px;">لا توجد إشعارات.</div>' : notifs.reverse().map(n => `<div style="border-bottom:1px solid #1e293b; padding:6px 0;">📌 ${n}</div>`).join('');
    document.getElementById('notificationsList').innerHTML = listHTML;
    document.getElementById('notificationsModal').style.display = 'flex';
}
function closeNotificationsModal() { document.getElementById('notificationsModal').style.display = 'none'; }
function clearNotifications() {
    localStorage.removeItem('ali_admin_notifications');
    localStorage.setItem('ali_last_notif_count', '0');
    document.getElementById('notificationsList').innerHTML = '<div style="text-align:center;">تم المسح.</div>';
}

// عرض تكتات المشتركين في لوحة الإدارة
function openTicketsManagerModal() {
    let allTickets = JSON.parse(localStorage.getItem('all_client_tickets')) || [];
    let container = document.getElementById('adminTicketsContainer');

    if(allTickets.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#64748b; padding:20px;">لا توجد تكتات مرسلة حالياً.</div>';
    } else {
        container.innerHTML = allTickets.map((t, idx) => `
            <div class="ticket-item">
                <div><b>المشترك:</b> <span style="color:#38bdf8">${t.subName}</span> (${t.ticketNum})</div>
                <div style="margin: 4px 0;"><b>الرسالة:</b> ${t.message}</div>
                <div style="font-size:10px; color:#f59e0b; margin-bottom:6px;"><b>الحالة:</b> ${t.status || 'جديد (بانتظار المراجعة)'}</div>
                <div style="display:flex; gap:5px;">
                    <button onclick="markTicketAsViewed(${idx})" style="flex:1; background:#0284c7; color:#fff; border:none; padding:5px; border-radius:4px; font-size:10px; cursor:pointer;">👁️ تم المشاهدة والتحويل</button>
                    <button onclick="openSingleReplyModal('${t.subName}')" style="flex:1; background:#10b981; color:#fff; border:none; padding:5px; border-radius:4px; font-size:10px; cursor:pointer;">💬 رد</button>
                </div>
            </div>
        `).join('');
    }
    document.getElementById('ticketsManagerModal').style.display = 'flex';
}
function closeTicketsManagerModal() { document.getElementById('ticketsManagerModal').style.display = 'none'; }

// تحديث حالة التكت إلى "تم المشاهدة والتحويل للأقسام المختصة"
function markTicketAsViewed(index) {
    let allTickets = JSON.parse(localStorage.getItem('all_client_tickets')) || [];
    if(allTickets[index]) {
        allTickets[index].status = '✅ تم المشاهدة وتحويله إلى الاقسام المختصة';
        localStorage.setItem('all_client_tickets', JSON.stringify(allTickets));
        
        // تحديث حالة التكت الخاصة بهذا المشترك في محادثته
        let subName = allTickets[index].subName;
        let chats = JSON.parse(localStorage.getItem(`ticket_chat_${subName}`)) || [];
        chats.push({ sender: "النظام", text: "ℹ️ تم مشاهدة التكت وتحويله إلى الأقسام المختصة." });
        localStorage.setItem(`ticket_chat_${subName}`, JSON.stringify(chats));

        alert("تم تحديث حالة التكت وإعلام المشترك بأنه تم تحويله للأقسام المختصة!");
        openTicketsManagerModal();
    }
}

function openSingleReplyModal(subName) {
    activeReplySubscriber = subName;
    document.getElementById('replyTargetName').innerText = subName;
    document.getElementById('singleAdminReplyText').value = '';
    document.getElementById('singleReplyModal').style.display = 'flex';
}
function closeSingleReplyModal() { document.getElementById('singleReplyModal').style.display = 'none'; }

// إرسال الرد للمشترك
function submitSingleReply() {
    let replyText = document.getElementById('singleAdminReplyText').value.trim();
    if(!replyText) { alert("يرجى كتابة نص الرد"); return; }

    let chatItem = { sender: "مكتب مهندس علي (الدعم الفني)", text: replyText };
    let chats = JSON.parse(localStorage.getItem(`ticket_chat_${activeReplySubscriber}`)) || [];
    chats.push(chatItem);
    localStorage.setItem(`ticket_chat_${activeReplySubscriber}`, JSON.stringify(chats));

    alert(`✅ تم إرسال الرد بنجاح إلى المشترك (${activeReplySubscriber})!`);
    closeSingleReplyModal();
}

window.onload = function() { renderSubs(); };
function renderSubs() {
    let query = document.getElementById('searchInput').value.trim().toLowerCase();
    let html = '';
    let paidCount = 0, agelCount = 0, expiredCount = 0;
    let today = new Date().toISOString().split('T')[0];

    subs.forEach(s => {
        let isExp = s.endDate < today;
        if(isExp) expiredCount++;
        if(s.payStatus === 'أجل') agelCount++; else paidCount++;
        if(query && !s.name.toLowerCase().includes(query) && !s.phone.includes(query)) return;

        let payBadge = s.payStatus === 'أجل' ? '<span style="color:#f59e0b;">[أجل]</span>' : '<span style="color:#10b981;">[واصل]</span>';
        html += `<div class="sub-card"><div><b>${s.name}</b> ${payBadge}</div></div>`;
    });
    document.getElementById('subList').innerHTML = html || '<div style="text-align:center; color:#64748b; padding:20px;">لا توجد بيانات.</div>';
    document.getElementById('totalSubs').innerText = subs.length;
    document.getElementById('paidSubs').innerText = paidCount;
    document.getElementById('agelSubs').innerText = agelCount;
    document.getElementById('expiredSubs').innerText = expiredCount;
}
</script>
</body>
</html>
