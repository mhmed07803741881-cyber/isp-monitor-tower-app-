<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقبة الأبراج - ISP Monitor</title>
    <style>
        body { background-color: #0f172a; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { background: #1e293b; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #334155; }
        .container { padding: 15px; }
        .card { background: #1e293b; border-radius: 10px; padding: 15px; margin-bottom: 15px; border-right: 5px solid #10b981; }
        .card.offline { border-right-color: #ef4444; }
        .btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px;}
        .btn-add { background: #16a34a; margin-bottom: 15px; }
        input { width: 100%; padding: 8px; margin: 5px 0 10px 0; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 4px; box-sizing: border-box;}
    </style>
</head>
<body>

<div class="header">📡 نظام مراقبة الأبراج (Tailscale VPN)</div>

<div class="container">
    <button class="btn btn-add" onclick="openModal()">+ إضافة برج جديد</button>
    <div id="towersList">جاري تحميل الأبراج...</div>
</div>

<!-- نافذة الإضافة -->
<div id="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); align-items:center; justify-content:center;">
    <div style="background:#1e293b; padding:20px; border-radius:10px; width:85%; max-width:350px;">
        <h3>إضافة برج جديد</h3>
        <label>اسم البرج / القطاع:</label>
        <input type="text" id="newName" placeholder="قطاع الجنوب">
        <label>عنوان الـ IP:</label>
        <input type="text" id="newIp" placeholder="192.168.88.x">
        <button class="btn" onclick="saveTower()">حفظ</button>
        <button class="btn" style="background:#64748b;" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<!-- عنصر صوتي للتنبيه (Beep) عند انقطاع الخدمة -->
<audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
const SERVER_URL = "http://100.x.x.x:5000"; // استبدل بـ IP سيرفر Tailscale الخاص بك

async function fetchTowers() {
    try {
        let res = await fetch(`${SERVER_URL}/api/towers`);
        let towers = await res.json();
        let html = '';
        let hasOffline = false;

        towers.forEach(t => {
            if(t.status === 'offline') hasOffline = true;
            html += `
                <div class="card ${t.status === 'offline' ? 'offline' : ''}">
                    <h3>${t.name} <span style="font-size:12px; float:left; color:${t.status === 'online' ? '#10b981' : '#ef4444'}">${t.status}</span></h3>
                    <p style="margin:5px 0; font-size:13px; color:#94a3b8;">IP: ${t.ip} | Ping: ${t.ping}</p>
                    <p style="margin:5px 0; font-size:13px; color:#94a3b8;">CCQ: ${t.ccq} | Signal: ${t.signal}</p>
                </div>
            `;
        });
        document.getElementById('towersList').innerHTML = html;

        // تشغيل صوت التنبيه في حال وجود جهاز مقطوع
        if(hasOffline) {
            let sound = document.getElementById('alertSound');
            sound.play().catch(e => console.log("يتطلب تفاعل المستخدم لتشغيل الصوت"));
        }
    } catch(err) {
        document.getElementById('towersList').innerHTML = "<p style='color:red;'>تعذر الاتصال بالسيرفر عبر Tailscale</p>";
    }
}

function openModal() { document.getElementById('modal').style.display = 'flex'; }
function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function saveTower() {
    let name = document.getElementById('newName').value;
    let ip = document.getElementById('newIp').value;
    if(!name || !ip) return alert("املأ الحقول من فضلك");

    await fetch(`${SERVER_URL}/api/towers/add`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({name, ip})
    });
    closeModal();
    fetchTowers();
}

// تحديث تلقائي كل 10 ثوانٍ
setInterval(fetchTowers, 10000);
fetchTowers();
</script>

</body>
</html>
