<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب الأبراج - ISP Monitor</title>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { background: #131d31; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .top-left-btns { display: flex; gap: 5px; }
        .btn-mini { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        
        .stats-bar { background: #131d31; padding: 8px 15px; display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px solid #1e293b; color: #94a3b8; }
        .stats-bar span { color: #fff; font-weight: bold; }

        .toolbar-row { background: #0d1526; padding: 8px 10px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; }
        .btn-action { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .btn-action.highlight { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #0ea5e9; }
        .btn-action.green-border { border-color: #10b981; color: #10b981; }

        .ping-indicators { display: flex; gap: 3px; align-items: center; justify-content: flex-end; padding: 5px 15px; background: #0d1526; }
        .dot { width: 10px; height: 14px; background: #10b981; border-radius: 2px; }

        .tower-section { background: #0d1526; padding: 5px 12px; }
        .tower-tabs-row { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; }
        .tower-tab { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tower-tab.active { background: #1e293b; color: #fff; border-color: #38bdf8; font-weight: bold; }
        
        .tower-sub-row { display: flex; gap: 8px; }
        .btn-sub { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 7px 16px; border-radius: 8px; font-size: 12px; cursor: pointer; }

        .filter-toolbar { padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto; background: #0d1526; border-top: 1px solid #1e293b; }
        .btn-filter { background: #1e293b; color: #94a3b8; border: 1px solid #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer; }
        .btn-filter.active { background: #1e293b; color: #fff; border-color: #3b82f6; }

        .table-container { padding: 10px 12px; }
        .device-card { background: #131d31; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #10b981; }
        .device-card.offline { border-right-color: #ef4444; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #131d31; padding: 20px; border-radius: 12px; width: 85%; max-width: 350px; border: 1px solid #334155; }
        input, select { width: 100%; padding: 9px; margin: 6px 0 12px 0; background: #0d1526; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div class="top-left-btns">
        <button class="btn-mini" onclick="if(confirm('هل تريد إغلاق التطبيق؟')) window.close();">⏻</button>
        <button class="btn-mini" onclick="alert('قسم الدعم الفني - مهندس علي عباس')">الدعم</button>
        <button class="btn-mini" onclick="alert('اللغة العربية مفعلة')">English</button>
        <button class="btn-mini">☀️</button>
    </div>
    <div style="text-align: left;">
        <div style="font-size: 16px; font-weight: bold;">مراقب الأبراج</div>
        <div style="font-size: 11px; color: #94a3b8;" id="txtHeaderSummary">0 جهاز على 0 برج</div>
    </div>
</div>

<div class="stats-bar">
    <div><span id="txtOnline" style="color:#10b981">0</span> يعمل</div>
    <div><span style="color:#f59e0b">0</span> بطيء</div>
    <div><span id="txtOffline" style="color:#ef4444">0</span> لا يعمل</div>
    <div>حالة النظام: <span style="color:#38bdf8">متصل</span></div>
</div>

<!-- صف الأزرار الأول -->
<div class="toolbar-row">
    <button class="btn-action" onclick="fetchData()">تحديث الكل</button>
    <button class="btn-action" onclick="searchDevicePrompt()">ابحث عن أجهزة</button>
    <button class="btn-action highlight" onclick="openModal()">أضف أجهزة</button>
    <button class="btn-action" onclick="showCredentials()">بيانات الدخول</button>
</div>

<!-- صف الأزرار الثاني -->
<div class="toolbar-row">
    <button class="btn-action green-border" onclick="fetchData()">🟢 Ping لحظي</button>
    <button class="btn-action" onclick="fetchData()">فحص الآن</button>
    <button class="btn-action" onclick="alert('اتصال VPN عبر Tailscale يعمل بنجاح')">🔌 VPN</button>
    <button class="btn-action" onclick="testSound()">🔔 التنبيهات</button>
</div>

<div class="ping-indicators" id="pingDots">
    <div class="dot"></div><div class="dot"></div>
</div>

<!-- شريط الأبراج -->
<div class="tower-section">
    <div class="tower-tabs-row" id="towerTabsBar">
        <div class="tower-tab active" onclick="selectTower('all')">كل الأبراج (0)</div>
    </div>
    <div class="tower-sub-row">
        <button class="btn-sub highlight" onclick="openModal()">+ برج جديد</button>
        <button class="btn-sub" onclick="exportConfig()">تصدير</button>
        <button class="btn-sub" onclick="importConfig()">استيراد</button>
    </div>
</div>

<!-- الفلاتر -->
<div class="filter-toolbar">
    <button class="btn-filter active" onclick="setFilter('all', this)">الكل</button>
    <button class="btn-filter" onclick="setFilter('offline', this)">لا يعمل</button>
    <button class="btn-filter" onclick="setFilter('online', this)">يعمل</button>
    <button class="btn-filter" onclick="setFilter('MikroTik', this)">MikroTik</button>
    <button class="btn-filter" onclick="setFilter('Ubiquiti', this)">Ubiquiti</button>
    <button class="btn-filter" onclick="setFilter('Mimosa', this)">Mimosa</button>
</div>

<!-- جدول الأجهزة -->
<div class="table-container" id="devicesList">
    <p style="text-align: center; color: #64748b; margin-top: 30px;">لا توجد أجهزة مضافة حالياً. اضغط على "+ برج جديد" أو "أضف أجهزة" للبدء.</p>
</div>

<!-- نافذة الإضافة -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top: 0; font-size: 16px;">إضافة برج وجهاز جديد</h3>
        
        <label style="font-size: 12px; color: #94a3b8;">اسم البرج:</label>
        <input type="text" id="towerNameInput" placeholder="مثال: برج السوق أو قطاع الشمال">

        <label style="font-size: 12px; color: #94a3b8;">اسم الجهاز أو القطاع:</label>
        <input type="text" id="devNameInput" placeholder="مثال: نقطة بث (AP)">

        <label style="font-size: 12px; color: #94a3b8;">عنوان الـ IP:</label>
        <input type="text" id="devIpInput" placeholder="10.x.x.x أو 192.168.88.x">

        <label style="font-size: 12px; color: #94a3b8;">نوع الجهاز:</label>
        <select id="devTypeInput">
            <option value="MikroTik">MikroTik</option>
            <option value="Ubiquiti">Ubiquiti</option>
            <option value="Mimosa">Mimosa</option>
        </select>

        <button class="submit-btn" onclick="saveDevice()">حفظ الجهاز</button>
        <button class="submit-btn" style="background: #475569; margin-top: 6px;" onclick="closeModal()">إلغاء</button>
    </div>
</div>

<audio id="alertSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

<script>
const SERVER_URL = "http://100.x.x.x:5000"; // استبدل بـ Tailscale IP الخاص بسيرفرك
let dataCache = {};
let currentFilter = 'all';
let selectedTower = 'all';

async function fetchData() {
    try {
        let res = await fetch(`${SERVER_URL}/api/towers`);
        dataCache = await res.json();
        renderUI();
    } catch(err) {
        document.getElementById('devicesList').innerHTML = "<p style='color:#ef4444; text-align:center;'>تعذر الاتصال بالسيرفر عبر Tailscale. تأكد من عمل سيرفر بايثون.</p>";
    }
}

function renderUI() {
    let html = '';
    let onlineCount = 0;
    let offlineCount = 0;
    let totalDevices = 0;
    let towersList = Object.keys(dataCache);
    let hasOffline = false;

    // بناء شريط الأبراج
    let tabsHtml = `<div class="tower-tab ${selectedTower === 'all' ? 'active' : ''}" onclick="selectTower('all')">كل الأبراج (${towersList.length})</div>`;
    towersList.forEach(t => {
        let count = dataCache[t].length;
        tabsHtml += `<div class="tower-tab ${selectedTower === t ? 'active' : ''}" onclick="selectTower('${t}')">${t} (${count})</div>`;
    });
    document.getElementById('towerTabsBar').innerHTML = tabsHtml;

    // تصفية وعرض الأجهزة
    towersList.forEach(tower => {
        if(selectedTower !== 'all' && selectedTower !== tower) return;

        dataCache[tower].forEach(d => {
            totalDevices++;
            if(d.status === 'online') onlineCount++;
            else {
                offlineCount++;
                hasOffline = true;
            }

            if(currentFilter === 'online' && d.status !== 'online') return;
            if(currentFilter === 'offline' && d.status !== 'offline') return;
            if(currentFilter !== 'all' && currentFilter !== 'online' && currentFilter !== 'offline' && d.type !== currentFilter) return;

            html += `
                <div class="device-card ${d.status === 'offline' ? 'offline' : ''}">
                    <div>
                        <div style="font-size: 14px; font-weight: bold; color: #fff;">${d.ip}</div>
                        <div style="font-size: 11px; color: #94a3b8; margin-top: 2px;">${d.name} [${tower}]</div>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <span style="font-size: 10px; background: #1e293b; padding: 3px 7px; border-radius: 4px; color: #cbd5e1; border: 1px solid #334155;">${d.type}</span>
                        <div style="text-align: left;">
                            <div style="font-size: 12px; color: ${d.status === 'online' ? '#10b981' : '#ef4444'}; font-weight: bold;">Ping: ${d.ping}</div>
                        </div>
                    </div>
                </div>
            `;
        });
    });

    document.getElementById('devicesList').innerHTML = html || "<p style='text-align:center; color:#64748b; margin-top:30px;'>لا توجد أجهزة مطابقة للفلتر الحالي.</p>";
    document.getElementById('txtOnline').innerText = onlineCount;
    document.getElementById('txtOffline').innerText = offlineCount;
    document.getElementById('txtHeaderSummary').innerText = `${totalDevices} جهاز على ${towersList.length} برج`;

    if(hasOffline) {
        testSound();
    }
}

function selectTower(towerName) {
    selectedTower = towerName;
    renderUI();
}

function setFilter(type, btn) {
    currentFilter = type;
    document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderUI();
}

function searchDevicePrompt() {
    let query = prompt("أدخل جزءاً من عنوان الـ IP أو اسم الجهاز للبحث عنه:");
    if(!query) return;
    let found = false;
    for(let t in dataCache) {
        dataCache[t].forEach(d => {
            if(d.ip.includes(query) || d.name.includes(query)) {
                alert(`موجود في البرج: [${t}]\nالاسم: ${d.name}\nIP: ${d.ip}\nالحالة: ${d.status}`);
                found = true;
            }
        });
    }
    if(!found) alert("لم يتم العثور على الجهاز المطابق.");
}

function showCredentials() {
    alert("إدارة بيانات الدخول الافتراضية:\n- MikroTik API: admin / [كلمة المرور الخاصة بك]\n- Ubiquiti SSH/Web: ubnt / ubnt");
}

async function exportConfig() {
    try {
        let res = await fetch(`${SERVER_URL}/api/data/export`);
        let data = await res.json();
        let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        let url = URL.createObjectURL(blob);
        let a = document.createElement('a');
        a.href = url;
        a.download = 'towers_backup.json';
        a.click();
    } catch(e) {
        alert("فشل تصدير الإعدادات");
    }
}

function importConfig() {
    let jsonStr = prompt("أصق كود الـ JSON الخاص بإعدادات الأبراج هنا:");
    if(!jsonStr) return;
    try {
        let parsed = JSON.parse(jsonStr);
        fetch(`${SERVER_URL}/api/data/import`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(parsed)
        }).then(() => {
            alert("تم استيراد الأبراج بنجاح!");
            fetchData();
        });
    } catch(err) {
        alert("صيغة الـ JSON غير صحيحة");
    }
}

function testSound() {
    let sound = document.getElementById('alertSound');
    sound.play().catch(e => console.log("التفاعل مطلوب للصوت"));
}

function openModal() { document.getElementById('addModal').style.display = 'flex'; }
function closeModal() { document.getElementById('addModal').style.display = 'none'; }

async function saveDevice() {
    let tower = document.getElementById('towerNameInput').value.trim() || "البرج الرئيسي";
    let name = document.getElementById('devNameInput').value.trim() || "نقطة بث";
    let ip = document.getElementById('devIpInput').value.trim();
    let type = document.getElementById('devTypeInput').value;

    if(!ip) return alert("يرجى إدخال عنوان الـ IP على الأقل");

    try {
        let res = await fetch(`${SERVER_URL}/api/device/add`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({tower, name, ip, type})
        });
        if(res.ok) {
            closeModal();
            document.getElementById('devIpInput').value = '';
            fetchData();
        } else {
            alert("فشل الحفظ");
        }
    } catch(err) {
        alert("خطأ في الاتصال بالسيرفر عبر Tailscale");
    }
}

setInterval(fetchData, 10000);
fetchData();
</script>

</body>
</html>
