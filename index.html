<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل الديون - Debt Manager</title>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; box-sizing: border-box; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .icon-btn { background: #131d31; color: #94a3b8; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .title-area { text-align: left; }
        .title-area h1 { margin: 0; font-size: 16px; color: #fff; }
        .title-area p { margin: 2px 0 0 0; font-size: 10px; color: #64748b; }

        .stats-bar { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 10px; background: #131d31; padding: 10px 12px; border-radius: 8px; border: 1px solid #1e293b; align-items: center; }
        .stats-bar span { font-weight: bold; }

        .toolbar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
        .action-btn { background: #131d31; color: #cbd5e1; border: 1px solid #1e293b; padding: 10px 6px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: center; white-space: nowrap; }
        .action-btn.active-blue { background: #38bdf8; color: #090d16; font-weight: bold; border-color: #38bdf8; }

        .debt-container { margin-top: 8px; }
        .empty-state { text-align: center; color: #64748b; padding: 30px 15px; background: #131d31; border-radius: 10px; border: 1px dashed #1e293b; font-size: 12px; }
        
        .debt-card { background:#131d31; border:1px solid #1e293b; padding:12px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-right:4px solid #ef4444; }
        .debt-card.paid { border-right-color: #10b981; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #131d31; padding: 18px; border-radius: 12px; width: 92%; max-width: 360px; border: 1px solid #1e293b; box-sizing: border-box; }
        input, select { width: 100%; padding: 10px; margin: 6px 0 12px 0; background: #0d1526; border: 1px solid #1e293b; color: white; border-radius: 6px; box-sizing: border-box; font-size: 13px; }
        .submit-btn { width: 100%; padding: 11px; background: #38bdf8; color: #090d16; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .cancel-btn { width: 100%; padding: 10px; background: #1e293b; color: #94a3b8; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; font-size: 13px; }
    </style>
</head>
<body>

<div class="top-header">
    <div style="display: flex; gap: 5px;">
        <button class="icon-btn" onclick="resetApp()">إعادة ضبط</button>
    </div>
    <div class="title-area">
        <h1>سجل ديون المشتركين</h1>
        <p id="headerSummary">0 زبون مسجل</p>
    </div>
</div>

<div class="stats-bar">
    <div>إجمالي الديون: <span id="totalDebt" style="color:#ef4444">0 د.ع</span></div>
    <div>الواصل: <span id="totalPaid" style="color:#10b981">0 د.ع</span></div>
    <div>المتبقي: <span id="totalRemaining" style="color:#38bdf8">0 د.ع</span></div>
</div>

<div class="toolbar-grid">
    <button class="action-btn active-blue" onclick="openModal('addDebtModal')">+ إضافة دين جديد</button>
    <button class="action-btn" onclick="exportData()">تصدير نسخة</button>
    <button class="action-btn" onclick="importData()">استيراد ملف</button>
</div>

<div class="debt-container" id="debtList">
    <div class="empty-state">لا توجد ديون مسجلة حالياً.<br>اضغط على "+ إضافة دين جديد" للبدء.</div>
</div>

<!-- نافذة إضافة دين جديد -->
<div id="addDebtModal" class="modal">
    <div class="modal-content">
        <h3>إضافة دين جديد لزبون</h3>
        <input type="text" id="custName" placeholder="اسم المشترك / الزبون (مثال: أحمد محمد)">
        <input type="number" id="custAmount" placeholder="مبلغ الدين الكلي (د.ع)">
        <input type="text" id="custPhone" placeholder="رقم الهاتف (اختياري)">
        <input type="text" id="custNotes" placeholder="ملاحظات (مثال: اشتراك شهر... / سحب كيبل)">
        <button class="submit-btn" onclick="saveNewDebt()">حفظ الدين</button>
        <button class="cancel-btn" onclick="closeModal('addDebtModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة تسديد جزء من الدين -->
<div id="payModal" class="modal">
    <div class="modal-content">
        <h3>تسديد دفعة</h3>
        <p id="payCustomerName" style="font-size: 12px; color: #38bdf8; margin-bottom: 10px;"></p>
        <input type="number" id="payAmountInput" placeholder="مبلغ التسديد (د.ع)">
        <button class="submit-btn" style="background:#10b981;" onclick="confirmPayment()">تثبيت التسديد</button>
        <button class="cancel-btn" onclick="closeModal('payModal')">إلغاء</button>
    </div>
</div>

<script>
let debts = JSON.parse(localStorage.getItem('isp_debt_book')) || [];
let currentPayId = null;

function render() {
    let html = '';
    let sumDebt = 0, sumPaid = 0;

    debts.forEach(d => {
        sumDebt += d.amount;
        sumPaid += d.paid;
        let remaining = d.amount - d.paid;
        let isFullyPaid = remaining <= 0;

        html += `
            <div class="debt-card ${isFullyPaid ? 'paid' : ''}">
                <div>
                    <div style="font-size: 14px; font-weight: bold; color:#fff;">${d.name} <span style="font-size:11px; color:#94a3b8;">(${d.phone || 'بدون هاتف'})</span></div>
                    <div style="font-size: 11px; color: #94a3b8; margin-top:2px;">${d.notes || 'اشتراك إنترنت'}</div>
                    <div style="font-size: 12px; margin-top: 4px;">
                        الدين: <span style="color:#f59e0b;">${d.amount}</span> | 
                        الواصل: <span style="color:#10b981;">${d.paid}</span> | 
                        المتبقي: <span style="color:${isFullyPaid ? '#10b981' : '#ef4444'}; font-weight:bold;">${remaining} د.ع</span>
                    </div>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    ${!isFullyPaid ? `<button onclick="openPayModal(${d.id})" style="background:#10b981; color:#fff; border:none; padding:6px 10px; border-radius:6px; font-size:11px; cursor:pointer;">تسديد</button>` : `<span style="font-size:11px; color:#10b981; font-weight:bold;">مُسدد بالكامل</span>`}
                    <button onclick="deleteDebt(${d.id})" style="background:none; border:none; color:#ef4444; cursor:pointer; font-size:12px; text-align:left;">🗑️ حذف</button>
                </div>
            </div>
        `;
    });

    document.getElementById('debtList').innerHTML = html || `<div class="empty-state">لا توجد ديون مسجلة حالياً.</div>`;
    document.getElementById('totalDebt').innerText = sumDebt + " د.ع";
    document.getElementById('totalPaid').innerText = sumPaid + " د.ع";
    document.getElementById('totalRemaining').innerText = (sumDebt - sumPaid) + " د.ع";
    document.getElementById('headerSummary').innerText = debts.length + " زبون مسجل";
}

function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function saveNewDebt() {
    let name = document.getElementById('custName').value.trim();
    let amount = parseFloat(document.getElementById('custAmount').value);
    let phone = document.getElementById('custPhone').value.trim();
    let notes = document.getElementById('custNotes').value.trim();

    if(!name || isNaN(amount)) {
        alert("يرجى إدخال اسم الزبون ومبلغ الدين بشكل صحيح");
        return;
    }

    debts.push({
        id: Date.now(),
        name: name,
        amount: amount,
        paid: 0,
        phone: phone,
        notes: notes,
        date: new Date().toLocaleDateString('ar-IQ')
    });

    localStorage.setItem('isp_debt_book', JSON.stringify(debts));
    document.getElementById('custName').value = '';
    document.getElementById('custAmount').value = '';
    document.getElementById('custPhone').value = '';
    document.getElementById('custNotes').value = '';
    closeModal('addDebtModal');
    render();
}

function openPayModal(id) {
    currentPayId = id;
    let d = debts.find(item => item.id === id);
    if(d) {
        document.getElementById('payCustomerName').innerText = "المشترك: " + d.name + " (المتبقي: " + (d.amount - d.paid) + " د.ع)";
        document.getElementById('payAmountInput').value = '';
        openModal('payModal');
    }
}

function confirmPayment() {
    let payVal = parseFloat(document.getElementById('payAmountInput').value);
    if(isNaN(payVal) || payVal <= 0) {
        alert("يرجى إدخال مبلغ صحيح للتسديد");
        return;
    }

    let d = debts.find(item => item.id === currentPayId);
    if(d) {
        d.paid += payVal;
        if(d.paid > d.amount) d.paid = d.amount; // لئلا يتجاوز المبلغ الكلي
        localStorage.setItem('isp_debt_book', JSON.stringify(debts));
        closeModal('payModal');
        render();
        alert("تم تثبيت التسديد بنجاح!");
    }
}

function deleteDebt(id) {
    if(confirm("هل تريد حذف سجل هذا الدين؟")) {
        debts = debts.filter(item => item.id !== id);
        localStorage.setItem('isp_debt_book', JSON.stringify(debts));
        render();
    }
}

function resetApp() {
    if(confirm("هل تريد مسح كافة السجلات وإعادة الضبط؟")) {
        localStorage.removeItem('isp_debt_book');
        debts = [];
        render();
    }
}

function exportData() {
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(debts));
    let dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "debt_book_backup.json");
    dl.click();
}

function importData() {
    let inp = document.createElement('input');
    inp.type = 'file';
    inp.onchange = e => {
        let r = new FileReader();
        r.readAsText(e.target.files[0], 'UTF-8');
        r.onload = ev => {
            try {
                debts = JSON.parse(ev.target.result);
                localStorage.setItem('isp_debt_book', JSON.stringify(debts));
                render();
                alert("تم استيراد سجل الديون بنجاح!");
            } catch(err) { alert("ملف غير صالح"); }
        }
    }
    inp.click();
}

render();
</script>
</body>
</html>
