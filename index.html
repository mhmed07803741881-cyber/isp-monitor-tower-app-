<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب الأبراج - ISP Cloud Monitor</title>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 0; }
        .header { background: #131d31; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; }
        .btn-mini { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 5px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; }
        .stats-bar { background: #131d31; padding: 8px 15px; display: flex; justify-content: space-between; font-size: 12px; border-bottom: 1px solid #1e293b; color: #94a3b8; }
        .stats-bar span { color: #fff; font-weight: bold; }
        .toolbar-row { background: #0d1526; padding: 8px 10px; display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; }
        .btn-action { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 14px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .btn-action.highlight { background: #38bdf8; color: #0f172a; font-weight: bold; border-color: #0ea5e9; }
        .tower-section { background: #0d1526; padding: 5px 12px; }
        .tower-tabs-row { display: flex; gap: 8px; margin-bottom: 8px; overflow-x: auto; }
        .tower-tab { background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 8px 18px; border-radius: 8px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tower-tab.active { background: #1e293b; color: #fff; border-color: #38bdf8; font-weight: bold; }
        .table-container { padding: 10px 12px; }
        .device-card { background: #131d31; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-right: 4px solid #10b981; }
        .device-card.offline { border-right-color: #ef4444; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #131d31; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; border: 1px solid #334155; box-sizing: border-box; }
        input, select { width: 100%; padding: 9px; margin: 6px 0 12px 0; background: #0d1526; border: 1px solid #334155; color: white; border-radius: 6px; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 10px; background: #38bdf8; color: #0f172a; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .cancel-btn { width: 100%; padding: 10px; background: #475569; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginModal" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1526; z-index:3000; display:flex; align-items:center; justify-content:center;">
    <div style="background:#131d31; padding:25px; border-radius:12px; width:85%; max-width:350px; border:1px solid #334155; text-align:center;">
        <h2 style="color:#fff; margin-bottom:5px;">مراقب الأبراج التجاري</h2>
        <p style="color:#94a3b8; font-size:12px; margin-bottom:20px;">تسجيل دخول صاحب الشبكة</p>
        <input type="text" id="loginUser" placeholder="اسم المستخدم" value="tower_owner_1">
        <input type="password" id="loginPass" placeholder="كلمة المرور" value="123">
        <button onclick="performLogin()" class="submit-btn">دخول للنظام</button>
    </div>
</div>

<div class="header">
    <div style="display: flex; gap: 5px;">
        <button class="btn-mini" onclick="logout()">خروج</button>
        <button class="btn-mini">الدعم</button>
    </div>
    <div style="text-align: left;">
        <div style="font-size: 15px; font-weight: bold;" id="ownerTitle">منظومة المراقبة</div>
        <div style="font-size: 10px; color: #94a3b8;" id="txtHeaderSummary">0 برج</div>
    </div>
</div>

<div class="stats-bar">
    <div><span id="txtOnline" style="color:#10b981">0</span> يعمل</div>
    <div><span id="txtOffline" style="color:#ef4444">0</span> لا يعمل</div>
    <div>الحالة: <span style="color:#38bdf8">متصل محلياً</span></div>
</div>

<div class="toolbar-row">
    <button class="btn-action" onclick="fetchData()">تحديث</button>
    <button class="btn-action highlight" onclick="openModal('addDeviceModal')">+ أضف جهاز</button>
    <button class="btn-action" onclick="openModal('vpnModal')">🔌 إعداد VPN</button>
</div>

<div class="tower-section">
    <div class="tower-tabs-row" id="towerTabsBar">
        <div class="tower-tab active" onclick="selectTower('all')">كل الأبراج</div>
    </div>
    <div class="tower-sub-row">
        <button class="btn-action highlight" onclick="openModal('addTowerModal')">+ برج جديد</button>
    </div>
</div>

<div class="table-container" id="devicesList">
    <p style="text-align: center; color: #64748b; margin-top: 30px;">يرجى تسجيل الدخول لعرض الأجهزة...</p>
</div>

<!-- نافذة إضافة برج -->
<div id="addTowerModal" class="modal">
    <div class="modal-content">
        <h3>برج جديد</h3>
        <input type="text" id="newTowerName" placeholder="اسم البرج (مثال: برج الحي العسكري)">
        <button class="submit-btn" onclick="saveNewTower()">حفظ البرج</button>
        <button class="cancel-btn" onclick="closeModal('addTowerModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة إضافة جهاز -->
<div id="addDeviceModal" class="modal">
    <div class="modal-content">
        <h3>إضافة جهاز جديد</h3>
        <select id="targetTowerSelect"></select>
        <input type="text" id="devNameInput" placeholder="اسم الجهاز (نقطة بث)">
        <input type="text" id="devIpInput" placeholder="عنوان الـ IP (مثال: 10.200.x.x)">
        <select id="devTypeInput">
            <option value="MikroTik">MikroTik</option>
            <option value="Ubiquiti">Ubiquiti</option>
            <option value="Mimosa">Mimosa</option>
        </select>
        <button class="submit-btn" onclick="saveNewDevice()">حفظ الجهاز</button>
        <button class="cancel-btn" onclick="closeModal('addDeviceModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة إعداد الـ VPN -->
<div id="vpnModal" class="modal">
    <div class="modal-content">
        <h3>🔌 ربط شبكة الـ VPN</h3>
        <p style="font-size:11px; color:#94a3b8;">إعدادات الـ VPN الخاصة بشركة إيرثلنك.</p>
        <input type="text" id="vpnHost" placeholder="Server Hostname (obpvpn.earthlink.iq)">
        <input type="text" id="vpnUser" placeholder="Username (admin@hilla51)">
        <input type="password" id="vpnPass" placeholder="Password">
        <button class="submit-btn" onclick="saveVpnSettings()">حفظ الاعتماد</button>
        <button class="cancel-btn" onclick="closeModal('vpnModal')">إغلاق</button>
    </div>
</div>

<script>
let dataCache = JSON.parse(localStorage.getItem('isp_data_cache')) || {
    "برج الحلة الرئيسي": [
        { id: 1, name: "قطاع الألياف الضوئية", ip: "10.0.0.1", type: "MikroTik", status: "online", ping: "2.1ms" },
        { id: 2, name: "نقطة بث الحي الصناعي", ip: "10.0.0.2", type: "Ubiquiti", status: "online", ping: "4.5ms" }
    ]
};
let selectedTower = 'all';

if(localStorage.getItem('is_logged_in') === 'true') {
    document.getElementById('loginModal').style.display = 'none';
    renderUI();
}

function performLogin() {
    let username = document.getElementById('loginUser').value.trim();
    let password = document.getElementById('loginPass').value.trim();
    
    if(username && password) {
        localStorage.setItem('is_logged_in', 'true');
        document.getElementById('loginModal').style.display = 'none';
        renderUI();
    } else {
        alert("يرجى إدخال اسم المستخدم وكلمة المرور");
    }
}

function logout() {
    localStorage.removeItem('is_logged_in');
    location.reload();
}

function fetchData() {
    renderUI();
    alert("تم التحديث بنجاح!");
}

function renderUI() {
    let html = '';
    let onlineCount = 0, offlineCount = 0;
    let towersList = Object.keys(dataCache);
    let targetSelectHtml = '';
    let tabsHtml = `<div class="tower-tab ${selectedTower === 'all' ? 'active' : ''}" onclick="selectTower('all')">كل الأبراج</div>`;

    towersList.forEach(t => {
        targetSelectHtml += `<option value="${t}">${t}</option>`;
        tabsHtml += `<div class="tower-tab ${selectedTower === t ? 'active' : ''}" onclick="selectTower('${t}')">${t}</div>`;
    });

    document.getElementById('targetTowerSelect').innerHTML = targetSelectHtml;
    document.getElementById('towerTabsBar').innerHTML = tabsHtml;

    towersList.forEach(tower => {
        if(selectedTower !== 'all' && selectedTower !== tower) return;
        dataCache[tower].forEach(d => {
            if(d.status === 'online') onlineCount++; else offlineCount++;
            html += `
                <div class="device-card ${d.status === 'offline' ? 'offline' : ''}">
                    <div>
                        <div style="font-size: 14px; font-weight: bold;">${d.ip}</div>
                        <div style="font-size: 11px; color: #94a3b8;">${d.name} [${tower}]</div>
                    </div>
                    <div style="text-align: left;">
                        <div style="font-size: 12px; color: ${d.status === 'online' ? '#10b981' : '#ef4444'}; font-weight: bold;">${d.ping}</div>
                    </div>
                </div>
            `;
        });
    });

    document.getElementById('devicesList').innerHTML = html || "<p style='text-align:center; color:#64748b; margin-top:20px;'>لا توجد أجهزة مضافة.</p>";
    document.getElementById('txtOnline').innerText = onlineCount;
    document.getElementById('txtOffline').innerText = offlineCount;
    document.getElementById('txtHeaderSummary').innerText = towersList.length + " برج";
}

function selectTower(t) { selectedTower = t; renderUI(); }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function saveNewTower() {
    let name = document.getElementById('newTowerName').value.trim();
    if(!name) return;
    if(!dataCache[name]) {
        dataCache[name] = [];
        localStorage.setItem('isp_data_cache', JSON.stringify(dataCache));
    }
    closeModal('addTowerModal');
    renderUI();
}

function saveNewDevice() {
    let tower = document.getElementById('targetTowerSelect').value;
    let name = document.getElementById('devNameInput').value.trim() || "AP";
    let ip = document.getElementById('devIpInput').value.trim();
    let type = document.getElementById('devTypeInput').value;
    if(!tower || !ip) return;
    
    let newId = Date.now();
    dataCache[tower].push({ id: newId, name: name, ip: ip, type: type, status: "online", ping: "1.8ms" });
    localStorage.setItem('isp_data_cache', JSON.stringify(dataCache));
    closeModal('addDeviceModal');
    renderUI();
}

function saveVpnSettings() {
    let host = document.getElementById('vpnHost').value;
    let user = document.getElementById('vpnUser').value;
    if(!host) { alert("يرجى إدخال عنوان الـ VPN"); return; }
    alert("تم حفظ إعدادات الـ VPN واعتمادها بنجاح!");
    closeModal('vpnModal');
}
</script>
</body>
</html>
