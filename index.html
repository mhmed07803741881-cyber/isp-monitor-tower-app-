<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISP Tower Monitoring</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
            --accent-blue: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 70px; }
        header { background: var(--card-bg); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        header h1 { font-size: 1.2rem; color: var(--accent-blue); display: flex; align-items: center; gap: 8px; }
        .container { padding: 15px; max-width: 600px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card-bg); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #334155; }
        .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
        .stat-card p { font-size: 1.2rem; font-weight: bold; }
        .section-title { font-size: 1rem; margin-bottom: 10px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; }
        .tower-card { background: var(--card-bg); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #334155; position: relative; }
        .tower-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tower-name { font-weight: bold; font-size: 1.05rem; }
        .status-badge { padding: 3px 8px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .status-online { background: rgba(16, 185, 129, 0.2); color: var(--accent-green); }
        .tower-details { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px; }
        .tower-details span strong { color: var(--text-main); }
        .tower-actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 8px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .btn-reboot { background: rgba(239, 68, 68, 0.2); color: var(--accent-red); border: 1px solid var(--accent-red); }
        .btn-ping { background: rgba(59, 130, 246, 0.2); color: var(--accent-blue); border: 1px solid var(--accent-blue); }
        nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; z-index: 1000; }
        nav button { background: none; border: none; color: var(--text-muted); font-size: 0.75rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        nav button.active { color: var(--accent-blue); }
        nav button svg { width: 22px; height: 22px; fill: currentColor; }
    </style>
</head>
<body>

    <header>
        <h1>📡 مراقبة الأبراج</h1>
        <span id="backend-status" class="status-badge status-online">Tailscale متصل</span>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>إجمالي الأبراج</h3>
                <p>2</p>
            </div>
            <div class="stat-card">
                <h3>حالة العمل</h3>
                <p style="color: var(--accent-green);">2</p>
            </div>
            <div class="stat-card">
                <h3>المنقطعة</h3>
                <p style="color: var(--accent-red);">0</p>
            </div>
        </div>

        <div class="section-title">
            <span>القطاعات والأبراج النشطة</span>
        </div>

        <div id="towers-list">
            <div class="tower-card">
                <div class="tower-header">
                    <span class="tower-name">قطاع الشمال - Sector 1</span>
                    <span class="status-badge status-online">يعمل</span>
                </div>
                <div class="tower-details">
                    <span>IP: <strong>192.168.88.2</strong></span>
                    <span>الـ Ping: <strong>2ms</strong></span>
                    <span>الإشارة: <strong>-55 dBm</strong></span>
                    <span>CCQ: <strong>98%</strong></span>
                </div>
                <div class="tower-actions">
                    <button class="btn btn-ping" onclick="pingDevice('192.168.88.2')">فحص الاتصال</button>
                    <button class="btn btn-reboot" onclick="rebootDevice('192.168.88.2')">إعادة تشغيل</button>
                </div>
            </div>

            <div class="tower-card">
                <div class="tower-header">
                    <span class="tower-name">برج السوق الرئيسي</span>
                    <span class="status-badge status-online">يعمل</span>
                </div>
                <div class="tower-details">
                    <span>IP: <strong>192.168.88.5</strong></span>
                    <span>الـ Ping: <strong>4ms</strong></span>
                    <span>الإشارة: <strong>-60 dBm</strong></span>
                    <span>CCQ: <strong>95%</strong></span>
                </div>
                <div class="tower-actions">
                    <button class="btn btn-ping" onclick="pingDevice('192.168.88.5')">فحص الاتصال</button>
                    <button class="btn btn-reboot" onclick="rebootDevice('192.168.88.5')">إعادة تشغيل</button>
                </div>
            </div>
        </div>
    </div>

    <nav>
        <button class="active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            الرئيسية
        </button>
        <button onclick="alert('قسم إدارة المشتركين')">
            <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
            المشتركين
        </button>
        <button onclick="alert('سجل التنبيهات')">
            <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>
            التنبيهات
        </button>
    </nav>

    <script>
        const BACKEND_URL = 'http://100.64.0.10:5000/api';

        async function rebootDevice(ip) {
            if(!confirm(`هل أنت متأكد من إعادة تشغيل الجهاز ذو الـ IP: ${ip}؟`)) return;
            try {
                let response = await fetch(`${BACKEND_URL}/reboot`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip: ip, username: 'admin', password: '' })
                });
                let result = await response.json();
                alert(result.message || 'تم إرسال أمر إعادة التشغيل بنجاح!');
            } catch (error) {
                alert('فشل الاتصال بالسيرفر عبر Tailscale.');
            }
        }
        function pingDevice(ip) {
            alert(`فحص الاتصال بالـ IP: ${ip} ... الاستجابة سليمة (2ms)`);
        }
    </script>
</body>
</html>
