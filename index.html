<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المشتركين - مهندس علي لخدمات الإنترنت</title>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; box-sizing: border-box; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .title-area h1 { margin: 0; font-size: 15px; color: #38bdf8; }
        .title-area p { margin: 2px 0 0 0; font-size: 10px; color: #94a3b8; }

        .stats-bar { display: flex; justify-content: space-between; font-size: 11px; color: #94a3b8; margin-bottom: 10px; background: #131d31; padding: 10px 12px; border-radius: 8px; border: 1px solid #1e293b; align-items: center; }
        .stats-bar span { font-weight: bold; }

        .toolbar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; margin-bottom: 8px; }
        .action-btn { background: #131d31; color: #cbd5e1; border: 1px solid #1e293b; padding: 10px; border-radius: 8px; font-size: 12px; cursor: pointer; text-align: center; }
        .action-btn.active-blue { background: #38bdf8; color: #090d16; font-weight: bold; border-color: #38bdf8; }

        .search-box { width: 100%; padding: 10px; margin-bottom: 8px; background: #131d31; border: 1px solid #1e293b; color: white; border-radius: 8px; box-sizing: border-box; font-size: 12px; }

        .sub-card { background:#131d31; border:1px solid #1e293b; padding:12px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; border-right:4px solid #10b981; }
        .sub-card.expired { border-right-color: #ef4444; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 9999; }
        .modal-content { background: #131d31; padding: 18px; border-radius: 12px; width: 92%; max-width: 380px; border: 1px solid #1e293b; box-sizing: border-box; }
        input { width: 100%; padding: 9px; margin: 5px 0 10px 0; background: #0d1526; border: 1px solid #1e293b; color: white; border-radius: 6px; box-sizing: border-box; font-size: 12px; }
        .submit-btn { width: 100%; padding: 10px; background: #38bdf8; color: #090d16; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .cancel-btn { width: 100%; padding: 9px; background: #1e293b; color: #94a3b8; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; font-size: 12px; }

        #printArea { display: none; background: #fff; color: #000; padding: 15px; font-family: Tahoma, sans-serif; direction: rtl; width: 280px; }
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
        }
    </style>
</head>
<body>

<div class="top-header">
    <div class="title-area">
        <h1>مهندس علي لخدمات الإنترنت</h1>
        <p>نظام إدارة المشتركين</p>
    </div>
    <button class="action-btn" onclick="resetApp()" style="padding: 6px 10px; font-size:10px;">إعادة ضبط</button>
</div>

<div class="stats-bar">
    <div>المشتركين: <span id="totalSubs" style="color:#38bdf8">0</span></div>
    <div>النشطين: <span id="activeSubs" style="color:#10b981">0</span></div>
    <div>المنتهين: <span id="expiredSubs" style="color:#ef4444">0</span></div>
</div>

<input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن اسم المشترك أو رقم الهاتف..." oninput="renderSubs()">

<div class="toolbar-grid">
    <button class="action-btn active-blue" onclick="openAddModal()">+ إضافة مشترك جديد</button>
    <button class="action-btn" onclick="exportData()">تصدير البيانات</button>
</div>

<div id="subList">
    <div style="text-align: center; color: #64748b; padding: 30px;">لا توجد اشتراكات مسجلة.
