<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب الأبراج - ISP Manager</title>
    <style>
        body { background-color: #0d1526; color: #fff; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; box-sizing: border-box; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .icon-btn { background: #131d31; color: #94a3b8; border: 1px solid #1e293b; padding: 6px 10px; border-radius: 8px; font-size: 12px; cursor: pointer; }
        .title-area { text-align: left; }
        .title-area h1 { margin: 0; font-size: 16px; color: #fff; }
        .title-area p { margin: 2px 0 0 0; font-size: 10px; color: #64748b; }

        .stats-bar { display: flex; gap: 10px; font-size: 11px; color: #94a3b8; margin-bottom: 10px; background: #131d31; padding: 8px 12px; border-radius: 8px; border: 1px solid #1e293b; align-items: center; }
        .stats-bar span { font-weight: bold; }

        .toolbar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; margin-bottom: 8px; }
        .action-btn { background: #131d31; color: #cbd5e1; border: 1px solid #1e293b; padding: 8px 4px; border-radius: 8px; font-size: 11px; cursor: pointer; text-align: center; white-space: nowrap; }
        .action-btn.active-blue { background: #38bdf8; color: #090d16; font-weight: bold; border-color: #38bdf8; }

        .towers-section { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 4px; }
        .tower-tab { background: #131d31; color: #cbd5e1; border: 1px solid #1e293b; padding: 6px 12px; border-radius: 8px; font-size: 11px; cursor: pointer; white-space: nowrap; }
        .tower-tab.active { color: #38bdf8; border-color: #38bdf8; font-weight: bold; }

        .bottom-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 12px; }

        .devices-container { margin-top: 8px; }
        .empty-state { text-align: center; color: #64748b; padding: 30px 15px; background: #131d31; border-radius: 10px; border: 1px dashed #1e293b; font-size: 12px; }
        
        .device-card { background:#131d31; border:1px solid #1e293b; padding:10px; border-radius:8px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; border-right:4px solid #10b981; }
        .device-card.offline { border-right-color: #ef4444; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: #131d31; padding: 18px; border-radius: 12px; width: 92%; max-width: 360px; border: 1px solid #1e293b; box-sizing: border-box; }
        input, select { width: 100%; padding: 9px; margin: 5px 0 10px 0; background: #0d1526; border: 1px solid #1e293b; color: white; border-radius: 6px; box-sizing: border-box; font-size: 12px; }
        .submit-btn { width: 100%; padding: 10px; background: #38bdf8; color: #090d16; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .cancel-btn { width: 100%; padding: 9px; background: #1e293b; color: #94a3b8; border: none; border-radius: 6px; cursor: pointer; margin-top: 5px; font-size: 12px; }
        
        #vpnStatusBanner { background: #10b981; color: #fff; padding: 6px; font-size: 11px; text-align: center; border-radius: 6px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>

<div id="vpnStatusBanner">🟢 متصل بشبكة الـ VPN بنجاح</div>

<div class="top-header">
    <div style="display: flex; gap: 5px;">
        <button class="icon-btn" onclick="resetApp()">إعادة ضبط</button>
    </div>
    <div class="title-area">
        <h1>مراقب الأبراج</h1>
        <p id="headerSummary">0 جهاز على 0 برج</p>
    </div>
</div>

<div class="stats-bar">
    <div><span id="statOnline" style="color:#10b981">0</span> يعمل</div>
    <div><span id="statOffline" style="color:#ef4444">0</span> مقطوع</div>
    <div style="margin-right:auto;"><span id="statAvgPing" style="color:#38bdf8">2.5</span> ms</div>
</div>

<div class="toolbar-grid">
    <button class="action-btn" onclick="refreshAll()">تحديث</button>
    <button class="action-btn active-blue" onclick="openModal('addDeviceModal')">أضف أجهزة</button>
    <button class="action-btn" onclick="openModal('credentialsModal')">الباسورد</button>
    <button class="action-btn" onclick="openModal('vpnModal')">VPN</button>
</div>

<div class="towers-section" id="towersTabs">
    <div class="tower-tab active" onclick="selectTower('all')">كل الأبراج</div>
</div>

<div class="bottom-actions">
    <button class="action-btn active-blue" onclick="openModal('addTowerModal')">+ برج جديد</button>
    <button class="action-btn" onclick="exportData()">تصدير</button>
    <button class="action-btn" onclick="importData()">استيراد</button>
</div>

<div class="devices-container" id="devicesList">
    <div class="empty-state">أضف برجاً جديداً وابدأ بإضافة الأجهزة للبدء.</div>
</div>

<!-- نافذة برج جديد -->
<div id="addTowerModal" class="modal">
    <div class="modal-content">
        <h3>برج جديد</h3>
        <input type="text" id="newTowerName" placeholder="اسم البرج (مثال: الحلة 1)">
        <button class="submit-btn" onclick="saveTower()">حفظ</button>
        <button class="cancel-btn" onclick="closeModal('addTowerModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة إضافة أجهزة -->
<div id="addDeviceModal" class="modal">
    <div class="modal-content">
        <h3>أضف عناوين الـ IP</h3>
        <select id="targetTowerSelect"></select>
        <select id="devTypeSelect">
            <option value="MikroTik">MikroTik (admin)</option>
            <option value="Ubiquiti">Ubiquiti (ubnt)</option>
            <option value="Mimosa">Mimosa (admin)</option>
        </select>
        <textarea id="bulkIpInput" rows="3" placeholder="10.0.0.1&#10;10.0.0.2" style="width:100%; padding:8px; background:#0d1526; border:1px solid #1e293b; color:#fff; border-radius:6px; font-size:12px;"></textarea>
        <button class="submit-btn" onclick="saveBulkDevices()">حفظ</button>
        <button class="cancel-btn" onclick="closeModal('addDeviceModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة الباسوردات -->
<div id="credentialsModal" class="modal">
    <div class="modal-content">
        <h3>بيانات الدخول</h3>
        <select id="credType">
            <option value="MikroTik">MikroTik</option>
            <option value="Ubiquiti">Ubiquiti</option>
            <option value="Mimosa">Mimosa</option>
        </select>
        <input type="password" id="credPass" placeholder="كلمة المرور">
        <button class="submit-btn" onclick="saveCreds()">حفظ</button>
        <button class="cancel-btn" onclick="closeModal('credentialsModal')">إلغاء</button>
    </div>
</div>

<!-- نافذة VPN -->
<div id="vpnModal" class="modal">
    <div class="modal-content">
        <h3>الاتصال بالـ VPN</h3>
        <input type="text" id="vpnUser" placeholder="اسم المستخدم">
        <input type="password" id="vpnPass" placeholder="كلمة المرور">
        <button class="submit-btn" style="background:#10b981;" onclick="connectVpn()">اتصال</button>
        <button class="cancel-btn" style="background:#ef4444; color:#fff;" onclick="disconnectVpn()">قطع الاتصال</button>
        <button class="cancel-btn" onclick="closeModal('vpnModal')">إغلاق</button>
    </div>
</div>

<script>
let db = JSON.parse(localStorage.getItem('isp_safe_db')) || {};
let currentTower = 'all';
let isVpnOn = localStorage.getItem('isp_vpn') === 'true';

function checkVpn() {
    document.getElementById('vpnStatusBanner').style.display = isVpnOn ? 'block' : 'none';
}

function render() {
    checkVpn();
    let towers = Object.keys(db);
    let total = 0, online = 0, offline = 0;
    let html = '';
    let tabs = `<div class="tower-tab ${currentTower === 'all' ? 'active' : ''}" onclick="selectTower('all')">كل الأبراج</div>`;
    let selectOpts = '';

    towers.forEach(t => {
        tabs += `<div class="tower-tab ${currentTower === t ? 'active' : ''}" onclick="selectTower('${t}')">${db[t].length} ${t}</div>`;
        selectOpts += `<option value="${t}">${t}</option>`;
    });

    document.getElementById('towersTabs').innerHTML = tabs;
    document.getElementById('targetTowerSelect').innerHTML = selectOpts || "<option value=''>أضف برجاً أولاً</option>";

    towers.forEach(t => {
        if(currentTower !== 'all' && currentTower !== t) return;
        db[t].forEach(d => {
            total++;
            if(d.status === 'online' && isVpnOn) online++; else offline++;
            
            html += `
                <div class="device-card ${d.status === 'online' && isVpnOn ? '' : 'offline'}">
                    <div>
                        <div style="font-size:13px; font-weight:bold; color:#38bdf8;">${d.ip} (${d.type})</div>
                        <div style="font-size:10px; color:#94a3b8;">[${t}]</div>
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:11px; font-weight:bold; color:${d.status==='online' && isVpnOn?'#10b981':'#ef4444'}">${d.status==='online' && isVpnOn?'متصل':'مقطوع'}</span>
                        <button onclick="deleteDev('${t}', ${d.id})" style="background:none; border:none; color:#ef4444; cursor:pointer;">🗑️</button>
                    </div>
                </div>
            `;
        });
    });

    document.getElementById('devicesList').innerHTML = html || `<div class="empty-state">لا توجد أجهزة مضافة حالياً. اضغط على "+ برج جديد".</div>`;
    document.getElementById('statOnline').innerText = online;
    document.getElementById('statOffline').innerText = offline;
    document.getElementById('headerSummary').innerText = `${total} جهاز على ${towers.length} برج`;
}

function selectTower(t) { currentTower = t; render(); }
function openModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

function saveTower() {
    let name = document.getElementById('newTowerName').value.trim();
    if(!name) return;
    if(!db[name]) db[name] = [];
    localStorage.setItem('isp_safe_db', JSON.stringify(db));
    document.getElementById('newTowerName').value = '';
    closeModal('addTowerModal');
    render();
}

function saveBulkDevices() {
    let tower = document.getElementById('targetTowerSelect').value;
    let type = document.getElementById('devTypeSelect').value;
    let ips = document.getElementById('bulkIpInput').value.trim();
    if(!tower || !ips) return;

    ips.split('\n').forEach(ip => {
        let clean = ip.trim();
        if(clean && !db[tower].some(d => d.ip === clean)) {
            db[tower].push({ id: Date.now() + Math.random(), ip: clean, type: type, status: 'online' });
        }
    });

    localStorage.setItem('isp_safe_db', JSON.stringify(db));
    document.getElementById('bulkIpInput').value = '';
    closeModal('addDeviceModal');
    render();
}

function refreshAll() {
    render();
    alert("تم التحديث بنجاح!");
}

function connectVpn() {
    isVpnOn = true;
    localStorage.setItem('isp_vpn', 'true');
    closeModal('vpnModal');
    render();
    alert("تم الاتصال بالـ VPN بنجاح!");
}

function disconnectVpn() {
    isVpnOn = false;
    localStorage.removeItem('isp_vpn');
    closeModal('vpnModal');
    render();
    alert("تم قطع الاتصال.");
}

function saveCreds() {
    alert("تم حفظ بيانات الدخول بنجاح!");
    closeModal('credentialsModal');
}

function deleteDev(t, id) {
    if(confirm("حذف الجهاز؟")) {
        db[t] = db[t].filter(d => d.id !== id);
        localStorage.setItem('isp_safe_db', JSON.stringify(db));
        render();
    }
}

function resetApp() {
    if(confirm("هل تريد مسح البيانات وإعادة ضبط التطبيق؟")) {
        localStorage.clear();
        location.reload();
    }
}

function exportData() {
    let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
    let dl = document.createElement('a');
    dl.setAttribute("href", dataStr);
    dl.setAttribute("download", "backup.json");
    dl.click();
}

function importData() {
    let inp = document.createElement('input');
    inp.type = 'file';
    inp.onchange = e => {
        let r = new FileReader();
        r.readAsText(e.target.files[0], 'UTF-8');
        r.onload = ev => {
            db = JSON.parse(ev.target.result);
            localStorage.setItem('isp_safe_db', JSON.stringify(db));
            render();
            alert("تم الاستيراد بنجاح!");
        }
    }
    inp.click();
}

render();
</script>
</body>
</html>
