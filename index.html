<!-- شاشة تسجيل الدخول للمشتركين -->
<div id="loginPage" style="position:fixed; top:0; left:0; width:100%; height:100%; background:#0d1526; z-index:2000; display:flex; align-items:center; justify-content:center;">
    <div style="background:#131d31; padding:25px; border-radius:12px; width:85%; max-width:350px; border:1px solid #334155; text-align:center;">
        <h2 style="color:#fff; margin-bottom:5px;">مراقب الأبراج</h2>
        <p style="color:#94a3b8; font-size:12px; margin-bottom:20px;">تسجيل الدخول لمنظومة المراقبة</p>
        
        <input type="text" id="loginUsername" placeholder="اسم المستخدم / رقم الهاتف" style="width:100%; padding:10px; margin-bottom:10px; background:#0d1526; border:1px solid #334155; color:#fff; border-radius:6px; box-sizing:border-box;">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" style="width:100%; padding:10px; margin-bottom:15px; background:#0d1526; border:1px solid #334155; color:#fff; border-radius:6px; box-sizing:border-box;">
        
        <button onclick="performLogin()" style="width:100%; padding:11px; background:#38bdf8; color:#0f172a; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">تسجيل الدخول</button>
    </div>
</div>

<script>
async function performLogin() {
    let username = document.getElementById('loginUsername').value.trim();
    let password = document.getElementById('loginPassword').value.trim();
    
    if(!username || !password) return alert("يرجى إدخال البيانات");

    try {
        let res = await fetch(`${SERVER_URL}/api/login`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        
        let data = await res.json();
        if(res.ok) {
            localStorage.setItem('user_token', data.token);
            document.getElementById('loginPage').style.display = 'none';
            fetchData(); // جلب أبراج هذا المشترك
        } else {
            alert(data.error || "فشل تسجيل الدخول");
        }
    } catch(e) {
        alert("تعذر الاتصال بالسيرفر الرئيسي");
    }
}
</script>
